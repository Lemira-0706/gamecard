<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>位面 · 互动叙事</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="btn-menu" class="icon-btn" title="模块">☰</button>
      <span class="app-title">位面</span>
    </div>
    <div class="topbar-right">
      <button id="btn-api" class="icon-btn" title="API 设置">⚙</button>
    </div>
  </header>

  <!-- 左侧模块导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">游戏模块</div>
    <nav class="module-list">
      <button class="module-item active" data-module="chat"><span class="m-icon">💬</span><span>对话</span></button>
      <button class="module-item" data-module="worldview"><span class="m-icon">🌌</span><span>世界观</span></button>
      <button class="module-item" data-module="planes"><span class="m-icon">🎴</span><span>位面系统</span></button>
      <button class="module-item" data-module="story"><span class="m-icon">📖</span><span>故事线</span></button>
      <button class="module-item" data-module="player"><span class="m-icon">🧑</span><span>玩家(宿主)</span></button>
      <button class="module-item" data-module="targets"><span class="m-icon">⭐</span><span>目标对象</span></button>
      <button class="module-item" data-module="supporters"><span class="m-icon">👥</span><span>配角</span></button>
      <button class="module-item" data-module="npcs"><span class="m-icon">🤖</span><span>NPC</span></button>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-newchat" class="primary-btn">+ 新对话</button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="content" id="content"><!-- 动态渲染 --></main>

</div>

<!-- API 设置弹窗 -->
<div class="modal-mask" id="api-modal" hidden>
  <div class="modal">
    <div class="modal-head"><span>API 设置</span><button class="icon-btn" id="close-api">✕</button></div>
    <div class="modal-body">
      <label>API 地址<textarea class="text-input" id="cfg-url" rows="2" placeholder="https://api.example.com/v1/chat/completions"></textarea></label>
      <label>API Key<input class="text-input" id="cfg-key" type="password" placeholder="sk-..."></label>
      <label>模型名称<input class="text-input" id="cfg-model" placeholder="gpt-4o / claude / qwen ..."></label>
      <label>Temperature<input class="text-input" id="cfg-temp" type="number" step="0.1" min="0" max="2" value="0.8"></label>
      <div class="modal-tip">配置仅保存在浏览器本地，不上传任何服务器。</div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" id="api-test">测试连接</button>
      <button class="primary-btn" id="api-save">保存</button>
    </div>
  </div>
</div>

<!-- 通用卡片编辑弹窗 -->
<div class="modal-mask" id="card-modal" hidden>
  <div class="modal modal-lg">
    <div class="modal-head"><span id="card-title">编辑</span><button class="icon-btn" id="close-card">✕</button></div>
    <div class="modal-body" id="card-body"></div>
    <div class="modal-foot">
      <button class="ghost-btn" id="card-delete">删除</button>
      <button class="primary-btn" id="card-save">保存</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
