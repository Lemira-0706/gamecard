<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>秘卡RPG · 世界随心而动</title>
<style id="theme-style">
  :root{
    --bg:#f4f7f4; --panel:#ffffff; --panel2:#f7faf7;
    --primary:#4caf7d; --primary-dark:#3a8c63; --primary-soft:#e8f6ee;
    --text:#2b3a32; --text-soft:#6b7c73; --line:#e4ece6;
    --bubble-me:#4caf7d; --bubble-other:#ffffff; --shadow:0 2px 12px rgba(76,175,125,.12);
    --danger:#ef5350; --warn:#f59e0b; --chip:#eef3f0;
  }
  body[data-theme="tianlan"]{
    --primary:#3b82f6; --primary-dark:#2563eb; --primary-soft:#eaf2fe;
    --bubble-me:#3b82f6; --chip:#eaf2fe;
    --shadow:0 2px 12px rgba(59,130,246,.12);
  }
  body[data-theme="qinglu"]{ /* 默认 */ }
  body[data-theme="qianka"]{
    --primary:#a9895f; --primary-dark:#8a6d47; --primary-soft:#f5eee2;
    --bubble-me:#a9895f; --bg:#faf7f2; --panel2:#fdfbf6; --line:#ece4d8; --chip:#f3ebde;
    --shadow:0 2px 12px rgba(169,137,95,.14);
  }
  body[data-theme="qianzi"]{
    --primary:#9b7ede; --primary-dark:#7c5fc4; --primary-soft:#f1ecfa;
    --bubble-me:#9b7ede; --chip:#f1ecfa;
    --shadow:0 2px 12px rgba(155,126,222,.15);
  }
  body[data-theme="youno"]{
    --bg:#121212; --panel:#1e1e1e; --panel2:#181818;
    --primary:#4caf7d; --primary-dark:#5fc48f; --primary-soft:#1c3a2b;
    --text:#e8e8e8; --text-soft:#a0a0a0; --line:#333;
    --bubble-me:#2e7d55; --bubble-other:#262626; --chip:#262626;
    --shadow:0 2px 12px rgba(0,0,0,.5);
  }
</style>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action: manipulation;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    transition:background .3s, color .3s;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit; color:var(--text);}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .app{display:flex; height:100%;}

  .sidebar{
    width:300px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; height:100%; z-index:30;
    transition:transform .3s;
    position:absolute; transform:translateX(-100%);
  }
  .sidebar.open{ transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.2); }
  .sb-head{padding:14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:var(--shadow);}
  .sb-title{font-weight:800; font-size:16px;}
  .sb-sub{font-size:11px; color:var(--text-soft);}
  .search-box{padding:10px 14px;}
  .search-box input{width:100%; padding:9px 14px 9px 36px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel2); outline:none; font-size:13px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%23999' viewBox='0 0 24 24'><path d='M10 2a8 8 0 105.29 14.13l4.79 4.79 1.42-1.42-4.79-4.79A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z'/></svg>"); background-repeat:no-repeat; background-position:12px center;}
  .sb-list{flex:1; overflow-y:auto; padding:4px 8px;}
  .world-item{border-radius:12px; margin-bottom:4px; overflow:hidden;}
  .world-row{display:flex; align-items:center; padding:10px; gap:8px; cursor:pointer; border-radius:12px; position:relative;}
  .world-row:hover{background:var(--panel2);}
  .world-row.expanded{background:var(--primary-soft);}
  .world-row .caret{color:var(--text-soft); font-size:12px; transition:transform .2s;}
  .world-row.expanded .caret{transform:rotate(90deg);}
  .world-emoji{font-size:18px; width:24px; text-align:center;}
  .world-name{flex:1; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-actions{display:none; gap:6px;}
  .world-row:hover .row-actions{display:flex;}
  .icon-btn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:14px;}
  .icon-btn:hover{background:var(--line);}
  .chat-list{padding-left:32px; padding-bottom:4px;}
  .chat-row{display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:13px; color:var(--text-soft);
    border-radius:8px; cursor:pointer; position:relative;}
  .chat-row:hover{background:var(--panel2); color:var(--text);}
  .chat-row.active{background:var(--primary-soft); color:var(--primary-dark); font-weight:600;}
  .chat-row .del{display:none; position:absolute; right:8px;}
  .chat-row:hover .del{display:block;}
  .sb-foot{padding:12px 14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; margin-top:auto;}
  .btn-primary{background:var(--primary); color:#fff; padding:11px; border-radius:20px; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px;}
  .btn-primary:active{transform:scale(.97);}
  .foot-links{display:flex; justify-content:space-between; font-size:12px; color:var(--text-soft);}
  .foot-links span{cursor:pointer; padding:4px 8px; border-radius:6px;}
  .foot-links span:hover{background:var(--panel2); color:var(--text);}

  .main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%; position:relative;}
  .topbar{height:52px; flex-shrink:0; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; padding:0 14px; gap:10px; z-index:10;}
  .topbar .menu-btn{font-size:20px; color:var(--text-soft); display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%;}
  .topbar .menu-btn:hover{background:var(--panel2);}
  .topbar .title{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar .sub{font-size:11px; color:var(--text-soft);}
  .top-actions{margin-left:auto; display:flex; gap:4px; align-items:center;}
  .model-tag{padding:4px 10px; border-radius:14px; background:var(--chip); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px;}

  .home{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; overflow-y:auto;}
  .home h1{font-size:26px; margin:6px 0; font-weight:800;}
  .home .slogan{color:var(--text-soft); font-size:14px; margin-bottom:40px;}
  .chat-preview{display:flex; gap:10px; margin-bottom:40px; opacity:.9;}
  .bubble-demo{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 14px; font-size:13px; box-shadow:var(--shadow); max-width:200px; text-align:left;}
  .bubble-demo.me{background:var(--bubble-me); color:#fff; border:none; align-self:flex-end;}
  .create-btn{background:var(--primary); color:#fff; padding:16px 48px; border-radius:30px; font-size:17px; font-weight:800; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px;}
  .create-btn:active{transform:scale(.97);}
  .hint{margin-top:18px; color:var(--text-soft); font-size:13px; line-height:1.8;}
  .hint kbd{background:var(--chip); padding:2px 8px; border-radius:6px; font-family:inherit; border:1px solid var(--line);}

  /* ===== 单张塔罗卡牌：众星捧月与月相变化 ===== */
  .single-moon-card {
    width: 180px;
    height: 260px;
    position: relative;
    border-radius: 14px;
    border: 6px solid #d4af37;
    background: radial-gradient(circle at 50% 40%, #251155, #10062c 80%);
    box-shadow: inset 0 0 20px rgba(0,0,0,.8), 0 15px 30px rgba(0,0,0,.6);
    overflow: hidden;
    margin-bottom: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 众星捧月背景：闪烁的密集点阵 */
  .bg-stars {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 60% 20%, #fff, transparent),
      radial-gradient(2px 2px at 80% 40%, #fff, transparent),
      radial-gradient(1px 1px at 10% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 90%, #fff, transparent);
    animation: bgStarsGlow 4s ease-in-out infinite;
  }

  /* 部分较大的星星 */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: starTwinkle 2s ease-in-out infinite;
  }
  .star1 { width: 4px; height: 4px; top: 30%; left: 20%; box-shadow: 0 0 10px #fff; }
  .star2 { width: 3px; height: 3px; top: 70%; left: 80%; box-shadow: 0 0 10px #fff; animation-delay: .5s; }
  .star3 { width: 5px; height: 5px; top: 50%; left: 10%; box-shadow: 0 0 15px #fff; animation-delay: 1s; }

  /* 月相变化核心 */
  .moon-phase {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #e0e8ff 70%, #c0c8e0);
    box-shadow: 0 0 30px 20px rgba(200, 220, 255, .4);
    z-index: 2;
    animation: moonCycle 12s ease-in-out infinite;
  }

  /* 使用伪元素作为“阴影”来遮挡月球，实现完美月相 */
  .moon-phase::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #150a30; /* 与卡牌背景色一致 */
    z-index: 3;
    animation: shadowMove 12s ease-in-out infinite;
  }

  /* 月相自然变化（阴影在黑球上左右移动） */
  @keyframes shadowMove {
    0%, 100% { transform: translateX(0px); }          /* 新月/全遮挡 */
    25% { transform: translateX(40px); }              /* 上弦月/半遮挡 */
    50% { transform: translateX(80px); }              /* 满月/无遮挡 */
    75% { transform: translateX(40px); }              /* 下弦月/半遮挡 */
  }

  @keyframes moonCycle {
    0%, 100% { opacity: .9; transform: scale(1); }
    25% { opacity: 1; transform: scale(1.05); }
    50% { opacity: 1; transform: scale(1.1); }
    75% { opacity: 1; transform: scale(1.05); }
  }

  @keyframes starTwinkle {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }

  @keyframes bgStarsGlow {
    0%, 100% { opacity: .5; }
    50% { opacity: .9; }
  }

  /* ===== 聊天区 ===== */
  .chat-area{flex:1; overflow-y:auto; padding:18px; background:var(--chat-bg, var(--bg)); background-size:cover; background-position:center;}
  .chat-area.with-bg{background-blend-mode:overlay;}
  .day-divider{text-align:center; margin:14px 0; font-size:12px; color:var(--text-soft);}
  .msg-row{display:flex; gap:10px; margin-bottom:16px; align-items:flex-end;}
  .msg-row.me{flex-direction:row-reverse;}
  .avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#fff;font-weight:700;box-shadow:var(--shadow); user-select:none;}
  .msg-body{max-width:68%; display:flex; flex-direction:column; gap:3px;}
  .msg-row.me .msg-body{align-items:flex-end;}
  .msg-meta{font-size:11px; color:var(--text-soft); padding:0 4px; display:flex; gap:8px; align-items:center;}
  .msg-name{font-weight:700;}
  .bubble{position: relative; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; word-break:break-word; box-shadow:var(--shadow); white-space: pre-wrap;}
  .msg-row.me .bubble{background:var(--bubble-me); color:#fff; border-bottom-right-radius:4px;}
  .msg-row:not(.me) .bubble{background:var(--bubble-other); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg-actions{display:none; gap:10px; font-size:11px; color:var(--text-soft); padding:2px 6px;}
  .msg-row:hover .msg-actions{display:flex;}
  .msg-row.me:hover .msg-actions{display:flex; justify-content:flex-end;}
  .msg-actions span:hover{color:var(--primary);}
  .sys-badge{font-size:10px; background:var(--primary-soft); color:var(--primary-dark); padding:1px 6px; border-radius:6px; font-weight:700;}
  .typing{opacity:.6; font-style:italic; color:var(--text-soft);}

  .input-bar{border-top:1px solid var(--line); background:var(--panel); padding:10px 12px; flex-shrink:0; padding-bottom: calc(10px + env(safe-area-inset-bottom));}
  .input-tools{display:flex; gap:6px; margin-bottom:8px; align-items:center;}
  .tool-btn{padding:6px 10px; border-radius:10px; font-size:12px; color:var(--text-soft); display:flex; align-items:center; gap:4px;}
  .tool-btn:hover{background:var(--panel2);}
  .tool-btn.active{background:var(--primary-soft); color:var(--primary-dark);}
  .input-row{display:flex; gap:8px; align-items:flex-end;}
  .input-row textarea{flex:1; resize:none; border:1px solid var(--line); border-radius:16px; padding:10px 14px; font-size:14px; outline:none; max-height:120px; background:var(--panel2); border-radius:18px;}
  .input-row textarea:focus{border-color:var(--primary);}
  .send-btn{background:var(--primary); color:#fff; width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0; box-shadow:var(--shadow); font-size:20px;}
  .send-btn:active{transform:scale(.92);}

  .mask{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{background:var(--panel); border-radius:20px; width:100%; max-width:720px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal.sm{max-width:420px;}
  .modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  .modal-head h3{margin:0; font-size:17px; display:flex; align-items:center; gap:8px;}
  .modal-body{flex:1; overflow-y:auto; padding:0;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex-shrink:0;}
  .btn{padding:9px 20px; border-radius:18px; font-weight:600; font-size:13px;}
  .btn-ghost{background:var(--panel2); color:var(--text);}
  .btn-cancel{background:transparent; color:var(--text-soft);}
  .btn-danger{background:var(--danger); color:#fff;}
  .close-x{font-size:22px; color:var(--text-soft); width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .close-x:hover{background:var(--panel2);}

  .tabs{display:flex; border-bottom:1px solid var(--line); overflow-x:auto; flex-shrink:0; padding:0 8px;}
  .tab{padding:13px 14px; font-size:13px; font-weight:600; color:var(--text-soft); white-space:nowrap; border-bottom:2px solid transparent; display:flex; align-items:center; gap:5px;}
  .tab.active{color:var(--primary); border-bottom-color:var(--primary);}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .tab .dot.required{background:var(--warn);}

  .tab-panel{padding:20px; display:none;}
  .tab-panel.active{display:block;}
  .field{margin-bottom:16px;}
  .field label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; margin-bottom:6px;}
  .req{color:var(--danger);}
  .field .tip{font-size:11px; color:var(--text-soft); font-weight:400; margin-left:auto;}
  
  .field input,.field textarea,.field select{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--panel2); outline:none; 
    font-size:13px; color: var(--text); box-shadow: inset 0 2px 4px rgba(0,0,0,.05); transition: all .2s;
  }
  .field textarea{min-height:90px; resize:vertical;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary); box-shadow: 0 0 0 3px var(--primary-soft), inset 0 1px 2px rgba(0,0,0,.05); background:var(--panel2);}
  .field input::placeholder, .field textarea::placeholder{color:var(--text-soft); opacity:.7;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .char-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px;}
  .char-card{border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--panel2); position:relative;}
  .char-card .del{position:absolute; top:10px; right:10px;}
  .char-card .cc-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .char-card .cc-name{font-weight:700; font-size:14px;}
  .cc-role{font-size:10px; padding:2px 8px; border-radius:8px; background:var(--primary-soft); color:var(--primary-dark); font-weight:700;}
  .cc-optional .cc-role{background:var(--chip); color:var(--text-soft);}
  .mini-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;cursor:pointer;position:relative;overflow:hidden;}
  .mini-avatar input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .thin-label{font-size:11px;color:var(--text-soft);margin:8px 0 3px;font-weight:600;}
  .thin-input{padding:6px 10px !important; font-size:12px !important; min-height:0 !important;}

  .preset-strip{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .preset-chip{padding:10px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; display:flex; flex-direction:column; gap:2px; background:var(--panel2);}
  .preset-chip:hover{border-color:var(--primary);}
  .preset-chip .e{font-size:20px;}
  .preset-chip .t{font-size:12px; font-weight:700;}

  .settings-group{margin-bottom:22px;}
  .settings-group h4{font-size:13px; margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px;}
  .api-row{display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px;}
  .api-row .key{flex:1;}
  .api-row .key input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); outline:none; font-size:12px;}
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
  .theme-card{border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; text-align:center;}
  .theme-card.active{border-color:var(--primary); box-shadow:var(--shadow);}
  .theme-dot{width:100%;height:28px;border-radius:8px;margin-bottom:6px;}
  .theme-card .n{font-size:12px; font-weight:600;}
  .data-btns{display:flex; gap:10px; flex-wrap:wrap;}
  .data-btns .btn{flex:1; min-width:120px; display:flex; align-items:center; justify-content:center; gap:6px;}

  .empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-soft); gap:10px; padding:40px;}
  .empty .e{font-size:48px;}

  @media (max-width:820px){
    .msg-body{max-width:80%;}
    .home .bubble-demo{display:none;}
  }
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25;display:none;}
  .scrim.show{display:block;}

  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--panel); padding:10px 22px; border-radius:20px; font-size:13px; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none;}
  .toast.show{opacity:1;}

  .page-head{padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-shrink:0; background:var(--panel);}
  .page-head .back{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:18px;}
  .page-head .back:hover{background:var(--panel2);}
  .page-head .pt{font-weight:800; font-size:16px;}
  .page-head .ps{font-size:11px;color:var(--text-soft);}
  .page-body{flex:1; overflow-y:auto; padding:20px;}

  .world-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
  .world-card{border:1px solid var(--line); border-radius:18px; padding:18px; background:var(--panel); box-shadow:var(--shadow); cursor:pointer; transition:transform .15s, border-color .15s; position:relative;}
  .world-card:hover{transform:translateY(-3px); border-color:var(--primary);}
  .wc-emoji{font-size:38px; margin-bottom:8px;}
  .wc-name{font-weight:800; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wc-tags{font-size:11px; color:var(--primary-dark); background:var(--primary-soft); display:inline-block; padding:2px 10px; border-radius:10px; margin:6px 0 10px;}
  .wc-desc{font-size:12px; color:var(--text-soft); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .wc-actions{display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .wc-actions .btn{flex:1; padding:7px 0; font-size:12px; border-radius:10px;}
  .wc-actions .btn-edit{background:var(--primary-soft); color:var(--primary-dark); font-weight:700;}
  .wc-actions .btn-del{background:var(--panel2); color:var(--danger);}
  .wc-preset{border-style:dashed; opacity:.92;}
  .wc-preset .wc-actions .btn-edit{background:var(--primary); color:#fff;}
  .cards-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .cards-toolbar .seg{font-size:13px; color:var(--text-soft); margin-left:auto;}

  .module-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .module-card{border:1px solid var(--line); border-radius:16px; padding:16px; background:var(--panel); cursor:pointer; transition:all .15s; position:relative;}
  .module-card:hover{border-color:var(--primary); box-shadow:var(--shadow);}
  .module-card .mc-icon{font-size:30px; margin-bottom:6px;}
  .module-card .mc-title{font-weight:800; font-size:14px;}
  .module-card .mc-desc{font-size:11px; color:var(--text-soft); line-height:1.5; margin-top:4px;}
  .module-card .mc-badge{position:absolute; top:12px; right:12px; font-size:10px; padding:2px 8px; border-radius:8px; font-weight:700;}
  .mc-badge.req{background:var(--primary-soft); color:var(--primary-dark);}
  .mc-badge.opt{background:var(--chip); color:var(--text-soft);}
  .mc-badge.done{background:#e8f6ee; color:#2e7d55;}
  .module-card .mc-toggle{position:absolute; bottom:14px; right:14px;}
  .enable-switch{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
  .enable-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;}
  .enable-switch.on{background:var(--primary);}
  .enable-switch.on::after{left:20px;}
  .module-card.disabled{opacity:.45; filter:grayscale(.6);}
  .module-card.disabled .mc-toggle{display:none;}
  .ov-hint{font-size:12px;color:var(--text-soft);line-height:1.7;background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:16px;}
  .ov-hint b{color:var(--primary-dark);}
</style>
</head>
<body data-theme="qinglu">
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => [...p.querySelectorAll(s)];
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function colorFromName(name){ const colors=['#ef5350','#ec407a','#ab47bc','#7e57c2','#5c6bc0','#42a5f5','#26c6da','#26a69a','#66bb6a','#ffa726','#8d6e63','#78909c']; let h=0; for(const c of name)h=(h*31+c.charCodeAt(0))|0; return colors[Math.abs(h)%colors.length]; }
function defaultAvatarText(name){ return (name||'?').trim().charAt(0).toUpperCase(); }
function randomTheme(){
  const themes=['tianlan','qinglu','qianka','qianzi','youno'];
  const newTheme = themes[Math.floor(Math.random()*themes.length)];
  Store.state.theme = newTheme;
  document.body.setAttribute('data-theme', newTheme);
  Store.save();
  toast('已切换主题');
}

const PRESETS = [
  { id:'p_cyber', name:'赛博朋克2077', emoji:'🌆', tags:'科幻 · 反乌托邦 · 赛博',
    world:'这是一个高度发达但阶级固化的大都会。巨型企业统治世界，人体改造泛滥，黑客和雇佣兵在霓虹灯下苟延残喘。主角是一名底层佣兵，大脑中植入了一枚神秘的芯片……' ,
    story:'主线：揭开芯片背后的秘密，反抗企业统治。\n阶段一：接单意外获得芯片，引来追杀\n阶段二：结识义体医生和黑客高手\n阶段三：潜入企业大厦窃取核心机密\n阶段四：引爆芯片，摧毁顶层秩序\n结局：成为传说中的“赛博英雄”',
    host:{name:'V', role:'赛博佣兵', desc:'潜入核心的先锋，脑部植入芯片。', avatarColor:'#00e5ff'},
    target:{name:'强尼·银手', role:'传奇黑客', desc:'刻在芯片里的数字幽灵，性格暴躁但重视兄弟。', avatarColor:'#ff5252'},
    system:{name:'终端系统', emoji:'💻', desc:'提供任务、载具、武器数据，只有宿主可交互。', avatarColor:'#7e57c2'} },
  { id:'p_xian', name:'仙侠修真界', emoji:'⛩️', tags:'东方玄幻 · 修真 · 虐恋',
    world:'自“飞升之路”断绝，修真界陷入万年大劫。门派林立，剑修、丹修、魔修并存，资源争夺残酷无比。主角是一名外门杂役，偶然获得上古传承……' ,
    story:'主线：从杂役到仙尊，化解天道危机。\n阶段一：意外觉醒仙骨，被逐出宗门\n阶段二：历练中结识魔尊和仙门圣女\n阶段三：发现天道大劫的幕后黑手\n阶段四：三界联手，重塑飞升之路\n结局：成就至尊之位，与爱人逍遥天地间',
    host:{name:'宁尘', role:'外门杂役', desc:'误入剑冢得传承，天生剑骨。', avatarColor:'#42a5f5'},
    target:{name:'洛清雪', role:'仙门圣女', desc:'表面清冷高傲，实则背负家族使命。', avatarColor:'#ec407a'},
    system:{name:'神剑系统', emoji:'🗡️', desc:'提供剑招、历练任务，只会被宿主听闻。', avatarColor:'#8d6e63'} },
  { id:'p_west', name:'西幻魔界大陆', emoji:'🧙‍♂️', tags:'剑与魔法 · 龙族 · 西幻',
    world:'龙族、精灵、人类共存的魔幻世界。魔法元素正在枯竭，深渊恶魔蠢蠢欲动。主角作为一名即将毕业的魔法学院学徒，被迫卷入守护大陆的战争……' ,
    story:'主线：寻找魔法源泉，抵御深渊入侵。\n阶段一：学院被偷袭，主角踏上逃亡之路\n阶段二：加入冒险者公会，结识各色同伴\n阶段三：找到精灵遗迹，唤醒远古巨龙\n阶段四：深渊裂开，终极决战爆发\n结局：以生命代价封印恶魔，成为大陆传说',
    host:{name:'艾尔文', role:'魔法学徒', desc:'拥有罕见的全元素亲和，是传说中预言之子。', avatarColor:'#ffa726'},
    target:{name:'蕾娜', role:'精灵游侠', desc:'精灵族的最后一位公主，身手矫健。', avatarColor:'#66bb6a'},
    system:{name:'魔法古书', emoji:'📕', desc:'记录世界真相，提供魔法线索。', avatarColor:'#ffa726'} },
];

function emptyWorld(){
  return {
    id:uid(), name:'未命名世界', emoji:'🌍', tags:'', world:'', dimension:'', story:'',
    api:{provider:'openai', baseUrl:'', apiKey:'', model:'gpt-4o-mini'},
    visual:{bgType:'color', bgValue:'', bgBlur:0},
    characters:{ host:null, target:null, sidekick:null, npc:null },
    chats:[]
  };
}

/* ---------- 状态 ---------- */
const Store = {
  state:{
    worlds: [],
    currentWorldId:null,
    currentChatId:null,
    expandedWorldId:null,
    theme:'qinglu',
    globalApi:{},
    apis:['openai','anthropic','google','deepseek','zhipu','moonshot','local'],
    sendMode:'group',
  },
  save(){
    try{ 
        localStorage.setItem('mika_rpg_v1', JSON.stringify(this.state)); 
    }catch(e){
        console.warn('本地存储失败，可能是APP清理了缓存或者存储已满', e);
        toast('⚠️ 数据保存失败，请检查存储空间');
    }
  },
  load(){
    try{
      const s=JSON.parse(localStorage.getItem('mika_rpg_v1'));
      if(s){ Object.assign(this.state, s); this.state.apis=this.state.apis||this.apis; }
    }catch(e){}
    PRESETS.forEach(p=>{
      const exists = this.state.worlds.find(w => w.name === p.name);
      if(!exists){
        const w=emptyWorld();
        w.name=p.name; w.emoji=p.emoji; w.tags=p.tags;
        w.world=p.world; w.story=p.story;
        w.characters={
          host:{name:p.host.name, role:p.host.role, desc:p.host.desc, color:p.host.avatarColor, img:''},
          target:{name:p.target.name, role:p.target.role, desc:p.target.desc, color:p.target.avatarColor, img:''},
          system:{name:p.system.name, emoji:p.system.emoji, desc:p.system.desc, color:p.system.avatarColor, img:''},
          sidekick:null, npc:null
        };
        w.chats=[ {id:uid(), title:'初次相遇', messages:[]} ];
        this.state.worlds.unshift(w);
      }
    });
    this.save();
  },
  getWorld(id){ return this.state.worlds.find(w=>w.id===id); },
  getCurrentWorld(){ return this.getWorld(this.state.currentWorldId); },
  getCurrentChat(){
    const w=this.getCurrentWorld(); if(!w)return null;
    return w.chats.find(c=>c.id===this.state.currentChatId) || w.chats[0];
  },
  getChatParticipants(world){
    const list=[];
    const c=world.characters;
    if(c.system)list.push({...c.system, pid:'system', isSystem:true});
    if(c.host)list.push({...c.host, pid:'host', isHost:true});
    if(c.target)list.push({...c.target, pid:'target'});
    if(c.sidekick)list.push({...c.sidekick, pid:'sidekick'});
    if(c.npc)list.push({...c.npc, pid:'npc'});
    return list;
  },
  addWorld(){
    const w=emptyWorld();
    this.state.worlds.push(w); this.save(); return w;
  },
  deleteWorld(id){
    this.state.worlds=this.state.worlds.filter(w=>w.id!==id);
    if(this.state.currentWorldId===id){ this.state.currentWorldId=null; this.state.currentChatId=null; }
    if(this.state.expandedWorldId===id) this.state.expandedWorldId=null;
    this.save(); UI.renderSidebar(); UI.renderMain();
  },
  newChat(worldId){
    const w=this.getWorld(worldId); if(!w)return;
    const chat={id:uid(), title:`新对话 ${w.chats.length+1}`, messages:[]};
    w.chats.unshift(chat);
    this.state.currentWorldId=worldId; this.state.currentChatId=chat.id;
    this.state.expandedWorldId=worldId;
    this.save(); UI.renderSidebar(); UI.renderMain();
  },
  deleteChat(worldId, chatId){
    const w=this.getWorld(worldId); if(!w)return;
    w.chats=w.chats.filter(c=>c.id!==chatId);
    if(!w.chats.length) w.chats.push({id:uid(), title:'新对话 1', messages:[]});
    if(this.state.currentChatId===chatId) this.state.currentChatId=w.chats[0].id;
    this.save(); UI.renderSidebar(); UI.renderMain();
  },
  clearChat(worldId, chatId){
    const w=this.getWorld(worldId); if(!w)return;
    const c=w.chats.find(x=>x.id===chatId); if(c){ c.messages=[]; }
    this.save(); UI.renderMain();
  },
  applyPreset(presetId){
    const p=PRESETS.find(x=>x.id===presetId); if(!p)return;
    const w=emptyWorld();
    w.name=p.name; w.emoji=p.emoji; w.tags=p.tags;
    w.world=p.world; w.story=p.story;
    w.characters={
      host:{name:p.host.name, role:p.host.role, desc:p.host.desc, color:p.host.avatarColor, img:''},
      target:{name:p.target.name, role:p.target.role, desc:p.target.desc, color:p.target.avatarColor, img:''},
      system:{name:p.system.name, emoji:p.system.emoji, desc:p.system.desc, color:p.system.avatarColor, img:''},
      sidekick:null, npc:null
    };
    w.chats=[{id:uid(), title:'初次相遇', messages:[]}];
    this.state.worlds.push(w); this.save(); UI.renderSidebar(); toast('已套用预设：'+p.name);
  }
};

/* ============================================================
   渲染层
   ============================================================ */
const UI = {
  renderSidebar(){
    const sb=$('#sidebar');
    const {worlds,currentWorldId,currentChatId,expandedWorldId}=Store.state;
    let html=`
      <div class="sb-head">
        <div class="logo">🎴</div>
        <div>
          <div class="sb-title">秘卡RPG</div>
          <div class="sb-sub">世界随心而动 ✨</div>
        </div>
      </div>
      <div class="search-box"><input id="worldSearch" placeholder="搜索世界…" value=""></div>
      <div class="sb-list" id="worldList">`;

    worlds.forEach(w=>{
      const expanded = expandedWorldId===w.id;
      const chars=Store.getChatParticipants(w);
      const av=(chars[0]||{emoji:'🌍'}).emoji||(chars[0]||{}).name?.charAt(0)||'🌍';
      html+=`
        <div class="world-item">
          <div class="world-row ${expanded?'expanded':''}" data-wid="${w.id}">
            <span class="caret">▶</span>
            <span class="world-emoji">${w.emoji||av}</span>
            <span class="world-name">${esc(w.name)}</span>
            <span class="row-actions">
              <span class="icon-btn" title="新对话" data-act="newchat" data-wid="${w.id}">＋</span>
              <span class="icon-btn" title="编辑" data-act="edit" data-wid="${w.id}">✎</span>
              <span class="icon-btn" title="删除" data-act="del" data-wid="${w.id}">🗑</span>
            </span>
          </div>`;
      if(expanded){
        html+=`<div class="chat-list">`;
        (w.chats||[]).forEach(c=>{
          html+=`<div class="chat-row ${c.id===currentChatId?'active':''}" data-cid="${c.id}" data-wid="${w.id}">
              <span>💬</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.title)}</span>
              <span class="del" data-act="delchat" data-wid="${w.id}" data-cid="${c.id}">🗑</span>
            </div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    });

    html+=`
      </div>
      <div class="sb-foot">
        <button class="btn-primary" id="btnCreateWorld">＋ 创作新世界</button>
        <div class="foot-links">
          <span id="btnAllCards">🌐 所有世界卡片</span>
          <span id="btnSettings">⚙️ 设置</span>
        </div>
      </div>`;
    sb.innerHTML=html;

    $('#worldSearch')?.addEventListener('input', e=>this._filterWorlds(e.target.value));
    
    $$('.world-row',sb).forEach(r=>r.onclick=()=>{
      const wid=r.dataset.wid;
      if(Store.state.expandedWorldId===wid){
        Store.state.expandedWorldId=null;
      } else {
        Store.state.expandedWorldId=wid;
      }
      Store.save(); 
      this.renderSidebar();
    });

    $$('.chat-row',sb).forEach(r=>r.onclick=()=>{
      const wid=r.dataset.wid;
      const cid=r.dataset.cid;
      Store.state.currentWorldId=wid;
      Store.state.currentChatId=cid;
      Store.save(); 
      this.renderSidebar(); 
      this.renderMain(); 
      this.closeMobile();
    });

    $$('[data-act]',sb).forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const act=b.dataset.act, wid=b.dataset.wid, cid=b.dataset.cid;
      if(act==='newchat'){ Store.newChat(wid); }
      else if(act==='edit'){ Modals.openCreateWorld(Store.getWorld(wid)); }
      else if(act==='del'){ if(confirm('确定删除这个世界？对话也将一并删除。')) Store.deleteWorld(wid); }
      else if(act==='delchat'){ if(confirm('删除这条对话？')) Store.deleteChat(wid,cid); }
    });
    
    $('#btnCreateWorld').onclick=()=>Modals.openCreateWorld();
    $('#btnSettings').onclick=()=>Modals.openSettings();
    $('#btnAllCards').onclick=()=>Modals.openAllCards();
  },
  _filterWorlds(q){
    q=(q||'').trim().toLowerCase();
    $$('.world-item', $('#sidebar')).forEach(it=>{
      const name=it.querySelector('.world-name')?.textContent||'';
      it.style.display = !q||name.toLowerCase().includes(q)?'':'none';
    });
  },
  closeMobile(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); },

  renderMain(){
    const main=$('#main');
    const {currentWorldId}=Store.state;
    const w=Store.getCurrentWorld();

    if(!w){
      main.innerHTML=`
        <div class="topbar">
          <button class="menu-btn" id="menuBtnHome">☰</button>
          <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
            <span class="logo" id="themeBtn" style="width:32px;height:32px;font-size:16px; cursor:pointer;" title="点击随机更换主题">🎴</span>
            <div>
              <div class="title">秘卡RPG</div>
              <div class="sub">世界随心而动 · 让故事为你展开</div>
            </div>
          </div>
        </div>
        <div class="home">
          <!-- 单张卡牌：众星捧月，月相变化 -->
          <div class="single-moon-card">
              <div class="bg-stars"></div>
              <div class="star star1"></div>
              <div class="star star2"></div>
              <div class="star star3"></div>
              <div class="moon-phase"></div>
          </div>
          <h1>世界随心而动</h1>
          <div class="slogan">指尖诞生的新世界，为命运洗牌。</div>
          <div class="chat-preview"></div>
          <button class="create-btn" id="homeCreate">🪄 创作新世界</button>
          <div class="hint">点击创作新世界卡<br>或点击左上角 <kbd>☰ 菜单</kbd> 选择已有世界开始对话</div>
        </div>`;
      $('#homeCreate').onclick=()=>Modals.openCreateWorld();
      $('#menuBtnHome').onclick=()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
      $('#themeBtn').onclick=()=>randomTheme();
      return;
    }

    const chat=Store.getCurrentChat();
    const bgStyle = w.visual?.bgType==='image' && w.visual.bgValue
       ? `background-image:url('${w.visual.bgValue}'); background-size:cover; background-position:center;`
       : (w.visual?.bgType==='color' && w.visual.bgValue ? `background:${w.visual.bgValue};` : '');

    main.innerHTML=`
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <span class="world-emoji" style="font-size:20px;">${w.emoji}</span>
        <div style="min-width:0;">
          <div class="title">${esc(w.name)}</div>
          <div class="sub">${esc(w.tags||'点击 ✎ 完善世界观')}</div>
        </div>
        <div class="top-actions">
          <div class="model-tag" id="modelTag" title="切换模型">🤖 ${esc(Store.getModelLabel(w))}</div>
          <button class="tool-btn" id="topNew" title="新建对话">＋</button>
          <button class="tool-btn" id="topClear" title="清空对话">🧹</button>
          <button class="tool-btn" id="topEdit" title="编辑世界">✎</button>
        </div>
      </div>
      <div class="chat-area ${w.visual?.bgType==='image'?'with-bg':''}" id="chatArea" style="${bgStyle}"></div>
      <div class="input-bar">
        <div id="simulateHint" style="font-size:11px;color:var(--warn);padding:0 4px 4px;display:none;">⚠️ 未配置 API Key，当前使用内置模拟回复</div>
        <div class="input-tools">
          <button class="tool-btn ${Store.state.sendMode==='dimension'?'active':''}" id="modeDim" title="仅宿主与位面系统可见">🎴 位面私聊</button>
          <button class="tool-btn ${Store.state.sendMode==='group'?'active':''}" id="modeGroup" title="群聊：所有角色可见">💬 群聊</button>
          <span style="flex:1;"></span>
          <button class="tool-btn" id="btnUpload" title="上传附件">📎 附件</button>
        </div>
        <div class="input-row">
          <textarea id="msgInput" rows="1" placeholder="请在这里输入文字…（Enter 发送）"></textarea>
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
      </div>`;

    this.renderMessages();
    this._wireChat(w);

    const hasKey = w.api?.apiKey || Store.state.globalApi?.[w.api?.provider]?.apiKey;
    const hint = document.getElementById('simulateHint');
    if(hint){
        hint.style.display = hasKey ? 'none' : 'block';
    }
  },

  renderMessages(){
    const area=$('#chatArea'); if(!area)return;
    const w=Store.getCurrentWorld(); const chat=Store.getCurrentChat();
    if(!chat)return;
    const msgs=chat.messages||[];
    const participants=Store.getChatParticipants(w);
    const getChar=(pid)=>participants.find(p=>p.pid===pid);

    let html='<div class="day-divider">—— 开始与 ' + esc(w.name) + ' 的对话 ——</div>';
    if(!msgs.length){
      html+=`<div class="empty" style="min-height:40vh;">
          <div class="e">💬</div>
          <div>还没有对话，发送第一条消息开始冒险吧！</div>
          <div style="font-size:12px;">提示：可用 <b>@{角色名}</b> 指定回复对象，如「@${esc((w.characters.target||{}).name||'目标对象')} 你好」</div>
        </div>`;
    }
    msgs.forEach(m=>{
      const me = m.from==='me';
      const author = me ? (w.characters.host?.name||'我') : (getChar(m.pid)?.name||m.name||'角色');
      const time = new Date(m.time||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const privateNote = m.private ? `<span class="sys-badge">仅宿主可见</span>` : '';

      html+=`
        <div class="msg-row ${me?'me':''}">
          <div class="avatar" style="background:${me?(w.characters.host?.color||'var(--primary)'):(getChar(m.pid)?.color||'#999')}">
            ${me ? defaultAvatarText(w.characters.host?.name||'我') : (getChar(m.pid)?.emoji||defaultAvatarText(getChar(m.pid)?.name||'?'))}
          </div>
          <div class="msg-body">
            <div class="msg-meta">
              <span class="msg-name">${esc(author)}</span>
              ${privateNote}
              <span>${time}</span>
            </div>
            <div class="bubble ${m.typing?'typing':''}">${esc(m.text)}</div>
            <div class="msg-actions ${me?'me-actions':''}">
              ${me?'':`<span data-act="regen" data-mid="${m.id}">🔄 重新生成</span>`}
              <span data-act="edit" data-mid="${m.id}">✎ 修改</span>
              <span data-act="del" data-mid="${m.id}">🗑 删除</span>
            </div>
          </div>
        </div>`;
    });
    area.innerHTML=html;
    area.scrollTop=area.scrollHeight;

    $$('[data-act]',area).forEach(b=>b.onclick=e=>{
      const act=b.dataset.act, mid=b.dataset.mid;
      const msg=chat.messages.find(x=>x.id===mid); if(!msg)return;
      if(act==='del'){ chat.messages=chat.messages.filter(x=>x.id!==mid); Store.save(); this.renderMessages(); }
      if(act==='edit'){ const t=prompt('修改消息内容',msg.text); if(t!=null){msg.text=t; Store.save(); this.renderMessages();} }
      if(act==='regen'){ this.simulateReply(w,chat,true); }
    });
  },
  _avatarSvg(color,ch){ return `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="${color}"/><text x="20" y="26" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">${ch}</text></svg>`; },

  _wireChat(w){
    $('#menuBtn').onclick=()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); };
    $('#topNew').onclick=()=>Store.newChat(w.id);
    $('#topClear').onclick=()=>{ if(confirm('清空当前对话所有消息？')){ Store.clearChat(w.id, Store.getCurrentChat().id); this.renderMessages();} };
    $('#topEdit').onclick=()=>Modals.openCreateWorld(w);
    $('#modelTag').onclick=()=>Modals.openSettings('api');
    $('#modeGroup').onclick=()=>{ Store.state.sendMode='group'; Store.save(); this.renderMain(); };
    $('#modeDim').onclick=()=>{ Store.state.sendMode='dimension'; Store.save(); this.renderMain(); };
    $('#btnUpload').onclick=()=>toast('附件功能：可在此上传图片/文件给角色参考');

    const ta=$('#msgInput'), send=$('#sendBtn');
    const doSend=()=>{
      const text=ta.value.trim(); if(!text)return;
      const chat=Store.getCurrentChat();
      const isDim = Store.state.sendMode==='dimension';
      let targetPid=null, body=text;
      const at=text.match(/^@(\S+)\s*/);
      if(at){ const nm=at[1]; const part=Store.getChatParticipants(w).find(p=>p.name===nm||p.role===nm); if(part)targetPid=part.pid; body=text.slice(at[0].length); }

      chat.messages.push({ id:uid(), from:'me', pid:'host', name:w.characters.host?.name||'我', text:body, time:Date.now(), private:isDim });
      ta.value=''; Store.save(); this.renderMessages();
      this.simulateReply(w,chat,false,targetPid,isDim);
    };
    send.onclick=doSend;
    if(window.visualViewport){
        window.visualViewport.addEventListener('resize', ()=>{
            const chatArea = $('#chatArea');
            if(chatArea) chatArea.scrollTop = chatArea.scrollHeight;
        });
    }
  },

  simulateReply(w, chat, regen, forcedTarget, isDim){
    const participants=Store.getChatParticipants(w);
    
    if(regen){
      for(let i = chat.messages.length - 1; i >= 0; i--){
        if(chat.messages[i].from !== 'me' && chat.messages[i].pid !== 'system'){
          chat.messages.splice(i, 1);
          Store.save(); 
          UI.renderMessages();
          break;
        }
      }
    }

    let responder=null;
    if(isDim){
      responder=participants.find(p=>p.pid==='system') || participants[1];
    } else if(forcedTarget){
      responder=participants.find(p=>p.pid===forcedTarget);
    } else {
      const candidates=participants.filter(p=>!p.isHost && !p.isSystem);
      responder = (w.characters.target && Math.random()<0.6) ? participants.find(p=>p.pid==='target')
                 : (candidates[Math.floor(Math.random()*candidates.length)] || participants[1]);
    }
    if(!responder)responder=participants[1]||participants[0];

    const lines={
      system:['🎴 检测到宿主情绪波动，正在重新评估攻略路线…','🎴 主线任务更新：请尝试接近【目标对象】','🎴 提示：当前位面稳定度 87%，理智值正常','🎴 已记录宿主选择，好感度 +3'],
      target:['……你这是什么意思？','哼，别以为我会轻易相信你。','谢谢你，刚才那一下……算我欠你的。','（目光移向别处）随你吧。'],
      sidekick:['老大！那边有情况！','交给我吧，这点小事难不倒我~','嘿嘿，我就知道你靠谱！'],
      npc:['欢迎来到本店，客官需要点什么？','这年头，活着就不容易啊…','听说城东最近不太平……'],
      host:['……','我在想，这一切是不是还能改变。']
    };
    const arr=lines[responder.pid]||lines.npc;
    const text=arr[Math.floor(Math.random()*arr.length)];

    const typingMsg={id:uid(), from:responder.pid, pid:responder.pid, name:responder.name, text:'正在输入…', typing:true, private:isDim, time:Date.now()};
    chat.messages.push(typingMsg); Store.save(); this.renderMessages();

    setTimeout(()=>{
      chat.messages=chat.messages.filter(m=>m.id!==typingMsg.id);
      chat.messages.push({id:uid(), from:responder.pid, pid:responder.pid, name:responder.name, text, time:Date.now(), private:isDim});
      Store.save(); this.renderMessages();
    }, 900+Math.random()*700);
  },
};

Store.getModelLabel=function(w){
  const a=w?.api; if(!a)return '未配置';
  const prov={openai:'OpenAI',anthropic:'Anthropic',google:'Google',deepseek:'DeepSeek',zhipu:'智谱',moonshot:'Kimi',local:'本地'};
  return (prov[a.provider]||a.provider) + (a.model? (' · '+a.model) : '');
};

const Modals = {
  current:null,
  open(html, opts={}){
    this.close();
    const mask=el('div','mask'); mask.innerHTML=html;
    document.body.appendChild(mask); this.current=mask;
    mask.onclick=e=>{ if(e.target===mask && opts.dismiss!==false) this.close(); };
    return mask;
  },
  close(){ if(this.current){ this.current.remove(); this.current=null; } },

  _ensureEnabled(w){
    w.enabled = w.enabled || { dimension:!!w.dimension, target:!!w.characters.target, side:!!w.characters.sidekick, npc:!!w.characters.npc };
    return w.enabled;
  },

  openCreateWorld(world){
    const isNew=!world;
    const w=world||Store.addWorld();
    Store.state.currentWorldId=w.id;
    this._ensureEnabled(w);
    const c=w.characters;
    let activeSub='basic';

    const modules=[
      {id:'basic',     icon:'⚙️', title:'基础设定',  desc:'世界名称 / 世界观（必填）', req:true},
      {id:'dimension', icon:'🎴', title:'位面系统',  desc:'给宿主下发任务、传达信息，仅宿主可见', optional:true},
      {id:'story',     icon:'📖', title:'故事线',    desc:'事件发展的重要走向（必填）', req:true},
      {id:'host',      icon:'🧑', title:'玩家·宿主', desc:'自定义 + 必填', req:true},
      {id:'target',    icon:'🎯', title:'目标对象',  desc:'除玩家外的重要角色', optional:true},
      {id:'side',      icon:'🎭', title:'配角',      desc:'推动剧情的次要角色', optional:true},
      {id:'npc',       icon:'🧩', title:'NPC',       desc:'背景人物、路人等', optional:true},
      {id:'api',       icon:'🔌', title:'API 配置',  desc:'选择厂商 / 模型，接入对话'},
      {id:'visual',    icon:'🎨', title:'视觉',      desc:'背景图及颜色'},
    ];

    const modal=this.open(`
      <div class="modal">
        <div class="page-head">
          <button class="back" id="pageBack">✕</button>
          <div>
            <div class="pt" id="pageTitle">🪄 ${isNew?'创作新世界':'编辑世界卡片'}</div>
            <div class="ps" id="pageSub">点击模块卡片进入编辑 · 带 ✅ 为已配置</div>
          </div>
          <span style="margin-left:auto;font-size:12px;color:var(--text-soft);">${esc(w.name)||'未命名世界'}</span>
        </div>
        <div class="page-body" id="pageBody"></div>
        <div class="modal-foot">
          <button class="btn btn-cancel">取消</button>
          <button class="btn btn-primary" id="saveWorld">💾 保存世界</button>
        </div>
      </div>`, {dismiss:false});

    const body=$('#pageBody',modal);
    const backBtn=$('#pageBack',modal);

    const renderOverview=()=>{
      const en=this._ensureEnabled(w);
      let html=`<div class="ov-hint">
        💡 <b>点击任意模块卡片</b>即可进入对应编辑页。<span class="req">*</span> 为基础设定（世界观、故事线、宿主）<b>必填</b>；
        <b>位面系统 / 目标 / 配角 / NPC</b> 为可选，打开右侧开关即可启用并编辑，关闭则不会出现在对话中。
      </div>
      <div class="module-cards">`;
      modules.forEach(m=>{
        const isOpt=!!m.optional;
        const enabled = isOpt ? en[m.id] : true;
        let badge=`<span class="mc-badge opt">可选</span>`;
        if(m.req) badge=`<span class="mc-badge req">必填</span>`;
        else if(isOpt && enabled) badge=`<span class="mc-badge done">已启用</span>`;
        const toggle = isOpt ? `<div class="enable-switch ${enabled?'on':''}" data-toggle="${m.id}" title="启用 / 关闭"></div>` : '';
        html+=`<div class="module-card ${enabled?'':'disabled'}" data-goto="${m.id}">
          ${badge}
          <div class="mc-icon">${m.icon}</div>
          <div class="mc-title">${m.title}</div>
          <div class="mc-desc">${m.desc}</div>
          <div class="mc-toggle">${toggle}</div>
        </div>`;
      });
      html+=`</div>`;
      body.innerHTML=html;

      $$('.module-card',body).forEach(card=>card.onclick=e=>{
        if(e.target.closest('.enable-switch'))return;
        activeSub=card.dataset.goto;
        renderSub(activeSub);
      });
      $$('[data-toggle]',body).forEach(sw=>sw.onclick=e=>{
        e.stopPropagation();
        const id=sw.dataset.toggle;
        en[id]=!en[id];
        if(en[id] && (id==='target'||id==='side'||id==='npc')){
          const map={target:'target',side:'sidekick',npc:'npc'};
          const type=map[id];
          if(!c[type]) c[type]={name:id==='target'?'目标对象':id==='side'?'配角':'NPC', role:'', desc:'', color:colorFromName(type+Date.now()), img:''};
        }
        Store.save(); renderOverview();
      });
    };

    const renderSub=(subId)=>{
      const m=modules.find(x=>x.id===subId);
      const en=this._ensureEnabled(w);
      const isOpt=!!m.optional;
      const enabled = isOpt ? en[subId] : true;

      if(isOpt && !enabled){
        backBtn.innerHTML='‹';
        backBtn.onclick=()=>show('overview');
        body.innerHTML=`<div class="empty" style="min-height:40vh;">
          <div class="e">${m.icon}</div>
          <div style="font-size:14px;font-weight:600;">${esc(m.title)} 尚未启用</div>
          <div style="font-size:12px;">开启后可在对话中登场。你也可以先填写内容，保存时会自动启用。</div>
          <button class="btn btn-primary" id="enableNow" style="margin-top:10px;">＋ 立即启用并编辑</button>
        </div>`;
        $('#enableNow',body).onclick=()=>{
          en[subId]=true;
          if(subId!=='dimension'){ const map={target:'target',side:'sidekick',npc:'npc'}; const type=map[subId]; if(!c[type])c[type]={name:m.title,role:'',desc:'',color:colorFromName(type+Date.now()),img:''}; }
          Store.save(); renderSub(subId);
        };
        return;
      }

      body.innerHTML=`<div style="max-width:560px;margin:0 auto;">${this._subHTML(subId, w)}</div>`;
      backBtn.innerHTML='‹';
      backBtn.onclick=()=>show('overview');
      this._wireSub(body, subId, w);
    };

    const show=(step, subId)=>{
      if(step==='overview') {
        backBtn.innerHTML = '✕';
        backBtn.onclick = () => this.close();
      }
      if(step==='overview') renderOverview();
      else renderSub(subId||activeSub);
    };
    show('overview');

    $('.btn-cancel',modal).onclick=()=>{ this.close(); UI.renderSidebar(); UI.renderMain(); };
    $('#saveWorld',modal).onclick=()=>this._saveWorld(w, modal, show);
  },

  _wireSub(body, subId, w){
    const c=w.characters;

    const bgColorInput = $('[data-f="bgColor"]', body);
    if(bgColorInput){
        bgColorInput.addEventListener('input', (e) => {
            const chatArea = $('#chatArea');
            if(chatArea) chatArea.style.background = e.target.value;
        });
    }
    $$('.mini-avatar input',body).forEach(inp=>{
      inp.onchange=e=>{
        const file=e.target.files[0]; if(!file)return;
        const r=new FileReader(); r.onload=()=>{
          const pid=inp.dataset.pid; if(pid==='system')c.system.img=r.result; else c[pid].img=r.result;
          inp.parentElement.style.backgroundImage=`url('${r.result}')`;
          const ph=inp.parentElement.querySelector('.ph'); if(ph)ph.style.display='none';
          Store.save();
        }; r.readAsDataURL(file);
      };
    });
    $$('[data-del-avatar]',body).forEach(b=>b.onclick=()=>{
      const pid=b.dataset.delAvatar;
      if(pid==='system')delete c.system.img; else delete c[pid].img;
      Store.save(); this._refreshSub(body, subId, w);
    });
    $$('[data-del-char]',body).forEach(b=>b.onclick=()=>{
      const pid=b.dataset.delChar;
      const map={target:'target',side:'sidekick',npc:'npc'};
      if(map[pid]){ c[map[pid]]=null; w.enabled[pid]=false; }
      Store.save(); this._refreshSub(body, subId, w);
    });
    const bgUp=$('[data-f="bgUpload"]',body);
    if(bgUp)bgUp.onchange=e=>{
      const file=e.target.files[0]; if(!file)return;
      const r=new FileReader(); r.onload=()=>{ w.visual.bgValue=r.result; Store.save(); toast('聊天背景已更新'); }; r.readAsDataURL(file);
    };
  },
  _refreshSub(body, subId, w){
    body.innerHTML=`<div style="max-width:560px;margin:0 auto;">${this._subHTML(subId, w)}</div>`;
    this._wireSub(body, subId, w);
  },

  _saveWorld(w, modal, show){
    const body=$('#pageBody',modal);
    const g=(sel)=>body.querySelector(sel);
    const nameF=g('[data-f="name"]'), worldF=g('[data-f="world"]'), storyF=g('[data-f="story"]');
    const name=nameF?.value.trim(), worldTxt=worldF?.value.trim(), storyTxt=storyF?.value.trim();

    if(nameF && !name){ toast('请填写世界名称'); nameF.focus(); return; }
    if(worldF && !worldTxt){ toast('世界观设定为必填项'); worldF.focus(); return; }
    if(storyF && !storyTxt){ toast('故事线为必填项'); storyF.focus(); return; }

    if(name) w.name=name;
    if(g('[data-f="tags"]')) w.tags=g('[data-f="tags"]').value.trim();
    if(g('[data-f="emoji"]')) w.emoji=g('[data-f="emoji"]').value.trim()||'🌍';
    if(worldTxt!==undefined) w.world=worldTxt;
    if(g('[data-f="dimension"]')) w.dimension=g('[data-f="dimension"]').value.trim();
    if(storyTxt!==undefined) w.story=storyTxt;

    if(g('[data-f="dimension"]') && w.characters.system){
      w.characters.system.desc = g('[data-f="dimension"]').value.trim() || w.characters.system.desc || '负责发布任务、提示进度。';
    }

    const hostCard = body.querySelector('[data-char="host"]');
    if(hostCard) {
      if(!w.characters.host) {
        w.characters.host = {name:'宿主(我)', role:'玩家', desc:'', color:'#4caf7d', img:''};
      }
      w.characters.host.name = hostCard.querySelector('[data-cf="name"]')?.value.trim() || '宿主';
      w.characters.host.role = hostCard.querySelector('[data-cf="role"]')?.value.trim() || '玩家';
      w.characters.host.desc = hostCard.querySelector('[data-cf="desc"]')?.value.trim() || '';
    }

    if(g('[data-f="target"]')) {
      if(!w.characters.target) w.characters.target = {name:'目标对象', role:'', desc:'', color:colorFromName('target'), img:''};
      w.characters.target.desc = g('[data-f="target"]').value.trim();
    }
    if(g('[data-f="side"]')) {
      if(!w.characters.sidekick) w.characters.sidekick = {name:'配角', role:'', desc:'', color:colorFromName('side'), img:''};
      w.characters.sidekick.desc = g('[data-f="side"]').value.trim();
    }
    if(g('[data-f="npc"]')) {
      if(!w.characters.npc) w.characters.npc = {name:'NPC', role:'', desc:'', color:colorFromName('npc'), img:''};
      w.characters.npc.desc = g('[data-f="npc"]').value.trim();
    }

    if(g('[data-f="bgType"]')){
      w.visual.bgType=g('[data-f="bgType"]').value;
      if(w.visual.bgType==='color') w.visual.bgValue=g('[data-f="bgColor"]')?.value||'#ffffff';
    }
    if(g('[data-f="provider"]')){
      w.api.provider=g('[data-f="provider"]').value;
      w.api.model=g('[data-f="model"]')?.value.trim()||'gpt-4o-mini';
      w.api.baseUrl=g('[data-f="baseUrl"]')?.value.trim()||'';
      w.api.apiKey=g('[data-f="apiKey"]')?.value.trim()||'';
    }

    const en=this._ensureEnabled(w);
    if(!en.target) w.characters.target=null;
    if(!en.side) w.characters.sidekick=null;
    if(!en.npc) w.characters.npc=null;

    if(!w.chats.length) w.chats.push({id:uid(), title:'新对话 1', messages:[]});
    Store.state.currentChatId=w.chats[0].id;
    Store.save();
    
    toast('世界已保存 🎉');
    UI.renderSidebar();
    if(show) {
      show('overview');

Store.Modals=Modals;

const API = {
  async call(world, messagesHistory){
    const cfg=world.api||{};
    const ga=Store.state.globalApi||{};
    const prov=cfg.provider||'openai';
    const key=cfg.apiKey || ga[prov]?.apiKey;
    const base=cfg.baseUrl || ga[prov]?.baseUrl;
    const model=cfg.model || 'gpt-4o-mini';
    if(!key){ return null; }
    try{
      if(prov==='openai'||prov==='deepseek'||prov==='zhipu'||prov==='moonshot'||prov==='local'){
        const url=(base||'https://api.openai.com/v1')+'/chat/completions';
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+key},body:JSON.stringify({model, messages:messagesHistory, temperature:0.9})});
        const j=await res.json();
        return j.choices?.[0]?.message?.content || '(模型返回为空)';
      }
      if(prov==='anthropic'){
        const url=(base||'https://api.anthropic.com')+'/v1/messages';
        const msgs=messagesHistory.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'assistant':'user', content:m.content}));
        const sys=messagesHistory.find(m=>m.role==='system')?.content;
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:model||'claude-3-5-sonnet-latest', system:sys, messages:msgs, max_tokens:1000})});
        const j=await res.json();
        return j.content?.[0]?.text || '(模型返回为空)';
      }
      if(prov==='google'){
        const url=`${(base||'https://generativelanguage.googleapis.com/v1beta')}/models/${model||'gemini-1.5-flash'}:generateContent?key=${key}`;
        const parts=messagesHistory.map(m=>({role:m.role==='assistant'?'model':'user', parts:[{text:m.content}]}));
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:parts})});
        const j=await res.json();
        return j.candidates?.[0]?.content?.parts?.[0]?.text || '(模型返回为空)';
      }
    }catch(err){ console.warn('API 调用失败，回退模拟：',err); return null; }
  },
  buildPrompt(world, chat, responderPid){
    const lines=[];
    lines.push(`你是「${world.name}」中的角色扮演 AI。以下是世界观与设定，请严格遵守：`);
    lines.push(`【世界观】\n${world.world}`);
    if(world.dimension) lines.push(`【位面系统规则】\n${world.dimension}`);
    lines.push(`【故事线】\n${world.story}`);
    const part=Store.getChatParticipants(world);
    part.forEach(p=>{
      if(p.isHost) lines.push(`【宿主/玩家：${p.name}】${p.desc||''}`);
      else if(p.isSystem) lines.push(`【位面系统】${p.desc||''}`);
      else lines.push(`【角色 ${p.name}（${p.role||''}）】${p.desc||''}`);
    });
    const resp=part.find(p=>p.pid===responderPid);
    lines.push(`\n当前你要扮演的角色是：${resp?.name}（${resp?.role||''}）。请完全代入该角色，用符合其性格、身份、说话风格的第一人称回复。不要跳出角色，不要以系统或旁白口吻。回复简洁（1-4 句），可含动作描写。如果收到"重新生成"指令则重新组织语言。`);
    return lines.join('\n\n');
  }
};

const _origSim=UI.simulateReply;
UI.simulateReply=function(w, chat, regen, forcedTarget, isDim){
  const participants=Store.getChatParticipants(w);
  let responder=null;
  if(isDim) responder=participants.find(p=>p.pid==='system')||participants[1];
  else if(forcedTarget) responder=participants.find(p=>p.pid===forcedTarget);
  else{
    const candidates=participants.filter(p=>!p.isHost&&!p.isSystem);
    responder=(w.characters.target&&Math.random()<0.6)?participants.find(p=>p.pid==='target'):(candidates[Math.floor(Math.random()*candidates.length)]||participants[1]);
  }
  if(!responder)responder=participants[1]||participants[0];

  const typingMsg={id:uid(), from:responder.pid, pid:responder.pid, name:responder.name, text:'正在输入…', typing:true, private:isDim, time:Date.now()};
  chat.messages.push(typingMsg); Store.save(); UI.renderMessages();

  const finish=(text)=>{
    chat.messages=chat.messages.filter(m=>m.id!==typingMsg.id);
    chat.messages.push({id:uid(), from:responder.pid, pid:responder.pid, name:responder.name, text:text||'(无回复)', time:Date.now(), private:isDim});
    Store.save(); UI.renderMessages();
  };

  const sysPrompt=API.buildPrompt(w,chat,responder.pid);
  const history=[{role:'system', content:sysPrompt}];
  (chat.messages.filter(m=>!m.typing).slice(-12)).forEach(m=>{
    const who=m.from==='me'?'user':'assistant';
    history.push({role:who, content:(m.private?'[仅宿主可见] ':'')+m.text});
  });

  API.call(w,history).then(res=>{
    if(res!=null) finish(res);
    else {
      setTimeout(()=>{
        const arr={system:['🎴 任务已记录，继续推进吧。','🎴 检测到关键抉择点，请谨慎。','🎴 提示：好感度发生变动。'],target:['……','哼，别以为我会轻易相信你。','（别过脸）随你吧。','谢谢你，刚才那一下。'],sidekick:['老大！那边有情况！','交给我吧~','嘿嘿，我就知道你靠谱！'],npc:['欢迎光临~','这年头，活着就不容易啊…','听说城东最近不太平……']}[responder.pid]||['……'];
        finish(arr[Math.floor(Math.random()*arr.length)]);
      }, 800+Math.random()*600);
    }
  });
};

      }
      if (Store.state.currentWorldId) {
          e.preventDefault();
          Store.state.currentWorldId = null;
          Store.state.currentChatId = null;
          Store.state.expandedWorldId = null;
          Store.save();
          UI.renderSidebar();
          UI.renderMain();
          return;
      }
      if ($('#sidebar').classList.contains('open')) {
          e.preventDefault();
          UI.closeMobile();
          return;
      }
  });
}
init();
</script>
</body>
</html>
