<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘卡RPG - 世界随心而动</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/zustand@4.5.1/dist/index.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #f0f2f5;
        }
        / Custom Scrollbar /
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        / Theme Variables /
        .theme-sky { --primary: #38bdf8; --primary-dark: #0284c7; --bg: #f0f9ff; }
        .theme-green { --primary: #34d399; --primary-dark: #059669; --bg: #f0fdf4; }
        .theme-coffee { --primary: #a78bfa; --primary-dark: #7c3aed; --bg: #faf5ff; } / Using purple for coffee vibe /
        .theme-purple { --primary: #818cf8; --primary-dark: #6366f1; --bg: #f5f3ff; }
        .theme-dark {
            --primary: #60a5fa; --primary-dark: #3b82f6;
            --bg: #111827; --text: #e5e7eb; --card-bg: #1f2937;
            --border: #374151; --input-bg: #374151;
        }
        .dark-mode .message-bubble { background-color: #374151 !important; color: #e5e7eb !important; }
        .dark-mode .input-area { background-color: #1f2937 !important; border-top: 1px solid #374151 !important; }
        .dark-mode input, .dark-mode textarea { background-color: #4b5563 !important; color: #e5e7eb !important; border-color: #6b7280 !important; }
        
        .avatar-placeholder {
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; border-radius: 50%;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { create } = zustand;

// --- Mock Data & Initial State ---
const INITIAL_WORLDS = [
    {
        id: '1', name: '穿越ABO世界', tag: '现代,ABO,甜宠', system: '这是一个典型的ABO社会...',
        characters: { host: { name: '林晚', desc: '穿越者' }, target: { name: '顾衍', desc: 'S级Alpha' } },
        chats: [
            { id: 'c1', sender: 'system', content: '欢迎来到这个世界，宿主。', time: '10:00', hidden: false },
            { id: 'c2', sender: 'host', content: '这里好热...', time: '10:01', hidden: false },
            { id: 'c3', sender: 'target', content: '做我的Omega吧。', time: '10:02', hidden: false }
        ]
    },
    {
        id: '2', name: '兽人荒原', tag: '奇幻,生存', system: '弱肉强食的世界...',
        characters: { host: { name: '凯' }, target: { name: '雷霆' } },
        chats: [{ id: 'c1', sender: 'system', content: '生存挑战开始！', time: '09:00', hidden: false }]
    },
    {
        id: '3', name: '克苏鲁调查员', tag: '恐怖,解谜', system: '不可名状的恐惧...',
        characters: { host: { name: '调查员' }, target: { name: '深潜者' } },
        chats: []
    }
];

// --- Store ---
const useStore = create((set, get) => ({
    worlds: JSON.parse(localStorage.getItem('rpg_worlds')) || INITIAL_WORLDS,
    currentWorldId: null,
    apiKey: localStorage.getItem('rpg_api_key') || '',
    theme: localStorage.getItem('rpg_theme') || 'sky',
    showSettings: false,
    showSidebar: true, // For mobile toggle
    
    // Actions
    addWorld: (world) => set((state) => ({ worlds: [...state.worlds, world] })),
    updateWorld: (id, data) => set((state) => ({
        worlds: state.worlds.map(w => w.id === id ? { ...w, ...data } : w)
    })),
    deleteWorld: (id) => set((state) => ({ worlds: state.worlds.filter(w => w.id !== id) })),
    setCurrentWorld: (id) => set({ currentWorldId: id }),
    
    saveApiKey: (key) => set({ apiKey: key }),
    setTheme: (theme) => set({ theme }),
    toggleSettings: () => set((s) => ({ showSettings: !s.showSettings })),
    toggleSidebar: () => set((s) => ({ showSidebar: !s.showSidebar })),
    
    // Chat actions
    addMessage: (worldId, message) => set((state) => ({
        worlds: state.worlds.map(w => {
            if (w.id === worldId) {
                return { ...w, chats: [...w.chats, message] };
            }
            return w;
        })
    })),
    clearChat: (worldId) => set((state) => ({
        worlds: state.worlds.map(w => w.id === worldId ? { ...w, chats: [] } : w)
    })),
}));

// Persist to localStorage
useStore.subscribe((state) => {
    localStorage.setItem('rpg_worlds', JSON.stringify(state.worlds));
    localStorage.setItem('rpg_api_key', state.apiKey);
    localStorage.setItem('rpg_theme', state.theme);
});

// --- Components ---

const Sidebar = () => {
    const { worlds, currentWorldId, setCurrentWorld, deleteWorld, showSidebar, toggleSidebar } = useStore();
    const [search, setSearch] = useState('');
    
    const filtered = worlds.filter(w => w.name.toLowerCase().includes(search.toLowerCase()));

    return (
        <>
            {/ Mobile Overlay /}
            {showSidebar && <div className="fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden" onClick={toggleSidebar}></div>}
            
            <div className={fixed md:relative w-80 h-full bg-white border-r z-40 transform transition-transform duration-300 ease-in-out ${showSidebar ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 flex flex-col}>
                {/ Header /}
                <div className="p-4 border-b flex items-center gap-2">
                    <div className="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 font-bold text-xl">R</div>
                    <h1 className="font-bold text-lg">秘卡RPG <i className="fas fa-heart text-pink-500 animate-pulse"></i><i className="fas fa-heart text-pink-500 animate-pulse delay-75"></i></h1>
                </div>

                {/ Search & Create /}
                <div className="p-4 space-y-2">
                    <input 
                        type="text" 
                        placeholder="搜索世界..." 
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                        className="w-full px-3 py-2 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button 
                        onClick={() => document.getElementById('createModal').showModal()}
                        className="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2 font-medium"
                    >
                        <i className="fas fa-plus"></i> 创作新世界 ✨
                    </button>
                </div>

                {/ World List /}
                <div className="flex-1 overflow-y-auto px-2 pb-4">
                    {filtered.map(world => (
                        <div key={world.id} className="group mb-1">
                            <div 
                                onClick={() => { setCurrentWorld(world.id); toggleSidebar(); }}
                                className={w-full p-3 rounded-lg flex items-center justify-between cursor-pointer hover:bg-gray-100 transition ${currentWorldId === world.id ? 'bg-indigo-50 border border-indigo-200' : ''}}
                            >
                                <div className="flex items-center gap-3 overflow-hidden">
                                    <div className="w-8 h-8 bg-indigo-200 rounded-full flex items-center justify-center font-bold text-indigo-600 text-sm shrink-0">W</div>
                                    <div className="truncate">
                                        <div className="font-semibold text-sm truncate">{world.name}</div>
                                        <div className="text-xs text-gray-500 truncate">{world.tag}</div>
                                    </div>
                                </div>
                                <button 
                                    onClick={(e) => { e.stopPropagation(); deleteWorld(world.id); }}
                                    className="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition"
                                >
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                            {/ Mock sub-chats in sidebar - as per image 2 /}
                            {world.chats.slice(0,2).map(c => (
                                <div key={c.id} className="ml-10 pl-2 py-1 text-xs text-gray-500 flex items-center gap-1 truncate border-l-2 border-gray-200 ml-4 mb-1">
                                    <i className="fas fa-comment-dots"></i> {c.content.substring(0,15)}...
                                </div>
                            ))}
                        </div>
                    ))}
                    {filtered.length === 0 && <div className="text-center text-gray-400 mt-10">未找到世界</div>}
                </div>

                <div className="p-4 border-t flex justify-around text-gray-500">
                    <button className="flex flex-col items-center gap-1"><i className="fas fa-layer-group"></i><span className="text-xs">所有卡片</span></button>
                    <button onClick={() => useStore.getState().toggleSettings()} className="flex flex-col items-center gap-1"><i className="fas fa-cog"></i><span className="text-xs">设置</span></button>
                </div>
            </div>
        </>
    );
};

const SettingsPanel = () => {
    const { theme, setTheme, apiKey, saveApiKey, showSettings } = useStore();
    const themes = [
        { id: 'sky', name: '恬静天蓝', icon: 'fa-cloud-sun' },
        { id: 'green', name: '清雅淡绿', icon: 'fa-leaf' },
        { id: 'coffee', name: '复古轻咖', icon: 'fa-mug-hot' },
        { id: 'purple', name: '朝暮浅紫', icon: 'fa-star' },
        { id: 'dark', name: '暗夜幽黑', icon: 'fa-moon' },
    ];

    return (
        <div className={fixed bottom-0 left-0 right-0 md:w-80 md:right-4 md:left-auto md:top-1/2 md:-translate-y-1/2 bg-white rounded-t-2xl md:rounded-2xl shadow-2xl z-50 transition-all duration-300 ${showSettings ? 'translate-y-0 opacity-100' : 'translate-y-full opacity-0 pointer-events-none'}}>
            <div className="p-4 border-b flex justify-between items-center">
                <h2 className="font-bold text-lg"><i className="fas fa-cog mr-2"></i>设置面板</h2>
                <button onClick={() => useStore.getState().toggleSettings()} className="text-gray-400"><i className="fas fa-times"></i></button>
            </div>
            <div className="p-4 space-y-4 max-h-96 overflow-y-auto">
                <div>
                    <h3 className="font-semibold mb-2">主题切换</h3>
                    <div className="grid grid-cols-5 gap-2">
                        {themes.map(t => (
                            <button 
                                key={t.id}
                                onClick={() => setTheme(t.id)}
                                className={p-2 rounded-lg flex flex-col items-center gap-1 ${theme === t.id ? 'bg-indigo-100 text-indigo-600' : 'hover:bg-gray-100'}}
                            >
                                <i className={fas ${t.icon}}></i>
                                <span className="text-xs">{t.name}</span>
                            </button>
                        ))}
                    </div>
                </div>
                <div>
                    <h3 className="font-semibold mb-2">API 配置</h3>
                    <textarea 
                        value={apiKey}
                        onChange={(e) => saveApiKey(e.target.value)}
                        placeholder="请输入您的 API Key..."
                        rows="3"
                        className="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    ></textarea>
                    <p className="text-xs text-gray-500 mt-1">支持 OpenAI 及兼容接口
                </div>
                <div className="flex gap-2 pt-2">
                    <button className="flex-1 border rounded-lg py-2 text-sm hover:bg-gray-50"><i className="fas fa-download mr-1"></i>导入数据</button>
                    <button className="flex-1 border rounded-lg py-2 text-sm hover:bg-gray-50"><i className="fas fa-upload mr-1"></i>导出数据</button>
                </div>
            </div>
        </div>
    );
};

const CreateWorldModal = () => {
    const { addWorld } = useStore();
    const [form, setForm] = useState({
        name: '', tag: '', system: '', host: '', target: '', story: ''
    });

    const handleSubmit = (e) => {
        e.preventDefault();
        if(!form.name || !form.system) return alert('名称和世界观必填');
        
        const newWorld = {
            id: Date.now().toString(),
            name: form.name,
            tag: form.tag,
            system: form.system,
            characters: { host: { name: form.host, desc: '' }, target: { name: form.target, desc: '' } },
            chats: [],
            createdAt: new Date().toLocaleString()
        };
        addWorld(newWorld);
        setForm({ name: '', tag: '', system: '', host: '', target: '', story: '' });
        document.getElementById('createModal').close();
    };

    return (
        <dialog id="createModal" className="backdrop:bg-black/50 rounded-2xl p-0 w-full max-w-2xl border-none outline-none">
            <div className="bg-white rounded-2xl overflow-hidden">
                <div className="p-4 border-b flex justify-between items-center bg-gradient-to-r from-indigo-50 to-purple-50">
                    <h2 className="font-bold text-xl text-indigo-600"><i className="fas fa-wand-magic-sparkles mr-2"></i>创作新世界 ✨</h2>
                    <button onClick={() => document.getElementById('createModal').close()} className="text-gray-500 text-2xl">&times;</button>
                </div>
                
                <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-sm font-medium mb-1">世界名称 *</label>
                            <input 
                                type="text" 
                                value={form.name}
                                onChange={(e) => setForm({...form, name: e.target.value})}
                                placeholder="如：ABO世界 / 现代都市"
                                className="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">标签</label>
                            <input 
                                type="text" 
                                value={form.tag}
                                onChange={(e) => setForm({...form, tag: e.target.value})}
                                placeholder="如：现代,ABO,甜宠"
                                className="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>
                    </div>

                    <div>
                        <label className="block text-sm font-medium mb-1">世界观设定 * (必写)</label>
                        <textarea 
                            value={form.system}
                            onChange={(e) => setForm({...form, system: e.target.value})}
                            placeholder="详细描述这个世界的背景规则、社会结构、特殊设定等..."
                            rows="4"
                            className="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        ></textarea>
                    </div>

                    <div>
                        <label className="block text-sm font-medium mb-1">主角 (宿主) 名称</label>
                        <input 
                            type="text" 
                            value={form.host}
                            onChange={(e) => setForm({...form, host: e.target.value})}
                            placeholder="宿主名称"
                            className="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                    </div>

                    <div>
                        <label className="block text-sm font-medium mb-1">目标对象名称</label>
                        <input 
                            type="text" 
                            value={form.target}
                            onChange={(e) => setForm({...form, target: e.target.value})}
                            placeholder="重要角色名称"
                            className="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                    </div>

                    <div>
                        <label className="block text-sm font-medium mb-1">故事线简介</label>
                        <textarea 
                            value={form.story}
                            onChange={(e) => setForm({...form, story: e.target.value})}
                            placeholder="故事的大致走向..."
                            rows="2"
                            className="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        ></textarea>
                    </div>
                    
                    <div className="flex justify-end gap-3 pt-4 border-t">
                        <button 
                            type="button" 
                            onClick={() => document.getElementById('createModal').close()}
                            className="px-4 py-2 border rounded-lg hover:bg-gray-50"
                        >取消</button>
                        <button 
                            type="submit"
                            className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
                        >保存世界</button>
                    </div>
                </form>
            </div>
        </dialog>
    );
};

const MessageBubble = ({ msg, isHost }) => {
    const getInitials = (str) => str ? str.trim().charAt(0) : '?';
    
    // Style based on sender
    let alignClass = 'justify-start';
    let bubbleClass = 'bg-white border border-gray-200';
    let textAlign = 'text-left';
    let avatarBg = 'bg-indigo-500';

    if (msg.sender === 'host') {
        alignClass = 'justify-end';
        bubbleClass = 'bg-indigo-500 text-white';
        avatarBg = 'bg-blue-800';
    } else if (msg.sender === 'target') {
        alignClass = 'justify-start';
        bubbleClass = 'bg-gray-100';
        avatarBg = 'bg-purple-500';
    }

    if (msg.hidden) return null; // Hide system private messages

    return (
        <div className={flex items-end gap-2 my-2 px-2 ${alignClass}}>
            {msg.sender !== 'host' && (
                <div className={w-8 h-8 rounded-full flex items-center justify-center text-white text-sm shrink-0 ${avatarBg}}>
                    {getInitials(msg.senderName || msg.sender)}
                </div>
            )}
            <div className={max-w-[70%] ${textAlign}}>
                <div className={p-3 rounded-2xl shadow-sm ${bubbleClass}}>
                    {msg.html ? <div dangerouslySetInnerHTML={{ __html: msg.html }} /> : msg.content}
                </div>
                <div className="text-xs text-gray-400 mt-1 px-1">{msg.time}</div>
            </div>
            {msg.sender === 'host' && (
                <div className={w-8 h-8 rounded-full flex items-center justify-center text-white text-sm shrink-0 ${avatarBg}}>
                    {getInitials(msg.senderName || '我')}
                </div>
            )}
        </div>
    );
};

const ChatInterface = () => {
    const { worlds, currentWorldId, addMessage, clearChat } = useStore();
    const [input, setInput] = useState('');
    const chatEndRef = useRef(null);
    
    const world = worlds.find(w => w.id === currentWorldId);
    
    // Auto scroll
    useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
    }, [world?.chats]);

    const handleSend = () => {
        if (!input.trim() || !world) return;

        const userMsg = {
            id: Date.now(),
            sender: 'host',
            senderName: world.characters.host.name || '宿主',
            content: input,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            hidden: false
        };

        const systemReply = {
            id: Date.now() + 1,
            sender: 'system',
            senderName: '位面系统',
            content: 收到了关于"${input}"的指令，正在改写现实...,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            hidden: true // System messages only visible to host
        };

        addMessage(currentWorldId, userMsg);
        setTimeout(() => addMessage(currentWorldId, systemReply), 500);
        
        setInput('');
    };

    if (!world) {
        return (
            <div className="flex-1 flex flex-col items-center justify-center text-gray-400 bg-gray-50">
                <i className="fas fa-compass text-6xl mb-4"></i>
                <h2 className="text-2xl font-bold mb-2">世界随心而动</h2>
                选择一个已有世界，或点击下方按钮开始你的冒险
                <button 
                    onClick={() => document.getElementById('createModal').showModal()}
                    className="mt-6 px-6 py-3 bg-indigo-600 text-white rounded-full text-lg shadow-lg hover:scale-105 transition-transform"
                >
                    创作新世界 ✨
                </button>
            </div>
        );
    }

    return (
        <div className="flex flex-col h-full bg-gray-50">
            {/ Chat Header /}
            <div className="p-4 border-b bg-white flex items-center gap-3 shadow-sm">
                <button onClick={() => useStore.setState({ currentWorldId: null })} className="md:hidden text-gray-500">
                    <i className="fas fa-arrow-left"></i>
                </button>
                <div className="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center font-bold text-indigo-600">
                    {world.name.charAt(0)}
                </div>
                <div>
                    <h2 className="font-bold">{world.name}</h2>
                    <p className="text-xs text-gray-500 truncate">{world.tag}
                </div>
            </div>

            {/ Messages Area /}
            <div className="flex-1 overflow-y-auto p-4 space-y-1 bg-gray-50">
                {world.chats.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-full text-gray-400">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'%3E%3Cpath d='M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'/%3E%3C/svg%3E" className="w-16 h-16 mb-4 opacity-50" />
                        <p className="text-lg">对话即将开始...
                        <p className="text-sm">向这个世界发送你的第一条消息吧。
                    </div>
                ) : (
                    world.chats.map(msg => <MessageBubble key={msg.id} msg={msg} />)
                )}
                <div ref={chatEndRef}></div>
            </div>

            {/ Input Area /}
            <div className="p-4 bg-white border-t">
                <div className="flex gap-2">
                    <button className="p-3 border rounded-full text-gray-500 hover:bg-gray-50">
                        <i className="fas fa-paperclip"></i>
                    </button>
                    <textarea 
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                        placeholder="请在这里输入文字..."
                        rows="1"
                        className="flex-1 border rounded-full p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                    ></textarea>
                    <button 
                        onClick={handleSend}
                        className="p-3 bg-indigo-600 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg hover:bg-indigo-700"
                    >
                        <i className="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    );
};

const Layout = () => {
    const { theme } = useStore();

    // Apply theme class to root
    useEffect(() => {
        const root = document.documentElement;
        root.classList.remove('theme-sky', 'theme-green', 'theme-coffee', 'theme-purple', 'theme-dark');
        root.classList.add(theme-${theme});
        if (theme === 'dark') {
            root.classList.add('dark-mode');
        } else {
            root.classList.remove('dark-mode');
        }
    }, [theme]);

    return (
        <div className={h-screen flex flex-col md:flex-row overflow-hidden transition-colors duration-300}>
            <Sidebar />
            <ChatInterface />
            <SettingsPanel />
            <CreateWorldModal />
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Layout />);
</script>

</body>
</html>
