<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 RPG世界观 · 沉浸式角色扮演</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .typing-dot { animation: blink 1.4s infinite both; }
    .typing-dot:nth-child(2){ animation-delay:.2s; }
    .typing-dot:nth-child(3){ animation-delay:.4s; }
    @keyframes blink{ 0%,80%,100%{opacity:.2;} 40%{opacity:1;} }

    .chat-bubble { position: relative; max-width: 72%; word-break: break-word; }
    .chat-bubble.user::after {
        content:''; position:absolute; right:-6px; top:12px;
        border:6px solid transparent; border-left-color: #95ec69; border-right:0;
    }
    .chat-bubble.other::after {
        content:''; position:absolute; left:-6px; top:12px;
        border:6px solid transparent; border-right-color: #fff; border-left:0;
    }
    .dark .chat-bubble.other::after { border-right-color: #2b2b2b; }

    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

    .card-hover { transition: all .2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }

    .modal-overlay { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
    textarea { resize: vertical; }

    .theme-sky     { --bg:#eef5ff; --side:#e3efff; --accent:#3b82f6; --accent-soft:#dbeafe; }
    .theme-green   { --bg:#f0faf0; --side:#e6f5e6; --accent:#22a06b; --accent-soft:#d9f2e4; }
    .theme-coffee  { --bg:#faf6f0; --side:#f3ebde; --accent:#a06a3b; --accent-soft:#f0e4d3; }
    .theme-purple  { --bg:#f8f3ff; --side:#efe7fa; --accent:#8b5cf6; --accent-soft:#ede9fe; }
    .theme-dark    { --bg:#1a1a1a; --side:#222; --accent:#6366f1; --accent-soft:#2d2b55; }

    .bg-app  { background: var(--bg); }
    .bg-side { background: var(--side); }
    .text-accent { color: var(--accent); }
    .bg-accent { background: var(--accent); }
    .bg-accent-soft { background: var(--accent-soft); }
    .border-accent { border-color: var(--accent); }

    .chip { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; background:var(--accent-soft); color:var(--accent); }

    /* 流式光标 */
    .stream-cursor::after { content:'▍'; animation: caret 1s step-end infinite; color: var(--accent); }
    @keyframes caret { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

    /* Markdown 内容样式 */
    .md-body p { margin: .35em 0; }
    .md-body strong { font-weight: 600; }
    .md-body em { font-style: italic; }
    .md-body code { background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
    .dark .md-body code { background: rgba(255,255,255,.12); }
    .md-body pre { background: rgba(0,0,0,.08); padding: 8px; border-radius: 8px; overflow-x: auto; margin: .5em 0; }
    .md-body blockquote { border-left: 3px solid var(--accent); padding-left: 8px; color: #666; margin: .5em 0; }
    .dark .md-body blockquote { color: #aaa; }
</style>
</head>
<body class="bg-app text-gray-800 transition-colors duration-300 h-screen flex">

<!-- ========== 左侧边栏 ========== -->
<aside id="sidebar" class="bg-side border-r border-black/5 flex flex-col h-full w-[300px] shrink-0 transition-colors duration-300">
    <div class="p-4 border-b border-black/5 shrink-0">
        <div class="flex items-center gap-2 mb-3">
            <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center text-white text-lg">
                <i class="fa-solid fa-globe"></i>
            </div>
            <div class="flex-1">
                <h1 class="font-bold text-sm">🎭 RPG世界观</h1>
                <p class="text-[10px] text-gray-500">沉浸式角色扮演工作台</p>
            </div>
        </div>
        <div class="relative">
            <input type="text" id="searchInput" placeholder="🔍 搜索对话..." class="w-full pl-9 pr-3 py-2 bg-white/70 dark:bg-white/10 rounded-lg text-sm border border-black/5 focus:outline-none focus:border-accent transition-all">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-2">
        <p class="text-[11px] text-gray-400 px-1 mb-1">🌍 我的世界</p>
        <div id="worldList" class="space-y-2"></div>

        <button onclick="openWorldModal()" class="w-full p-4 rounded-xl border-2 border-dashed border-gray-300 hover:border-accent text-gray-400 hover:text-accent transition-all text-sm flex flex-col items-center gap-1">
            <i class="fa-solid fa-plus text-lg"></i>
            <span>创作新世界 ✨</span>
        </button>
    </div>

    <div class="p-3 border-t border-black/5 shrink-0 space-y-1 text-sm">
        <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/60 transition-all">
            <i class="fa-solid fa-gear text-accent w-5"></i><span>⚙️ 设置</span>
        </button>
        <button onclick="exportData()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/60 transition-all">
            <i class="fa-solid fa-file-export text-accent w-5"></i><span>📤 导出数据</span>
        </button>
        <button onclick="importData()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/60 transition-all">
            <i class="fa-solid fa-file-import text-accent w-5"></i><span>📥 导入数据</span>
        </button>
    </div>
</aside>

<!-- ========== 右侧主区 ========== -->
<main class="flex-1 flex flex-col h-full min-w-0">
    <header class="h-14 border-b border-black/5 flex items-center px-4 gap-3 shrink-0 bg-white/40 dark:bg-white/5">
        <div id="chatAvatar" class="w-9 h-9 rounded-full bg-accent-soft flex items-center justify-center text-accent text-lg shrink-0 overflow-hidden">
            <i class="fa-solid fa-earth-americas"></i>
        </div>
        <div class="flex-1 min-w-0">
            <h2 id="chatTitle" class="font-bold text-sm truncate">选择一个世界开始冒险 🚀</h2>
            <p id="chatSubtitle" class="text-[11px] text-gray-500 truncate">从左侧选择或创作一个新世界</p>
        </div>
        <button onclick="openWorldModal()" class="px-3 py-1.5 rounded-lg bg-accent text-white text-xs hover:opacity-90 transition">
            <i class="fa-solid fa-pen-to-square mr-1"></i>编辑世界
        </button>
        <button onclick="clearChat()" class="px-3 py-1.5 rounded-lg border border-black/10 text-xs hover:bg-white/60 transition">
            <i class="fa-solid fa-trash-can mr-1"></i>清空
        </button>
    </header>

    <div id="chatArea" class="flex-1 overflow-y-auto p-4 space-y-4 bg-app/50" style="background-image: var(--chat-bg); background-size: cover;">
        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400 text-center">
            <i class="fa-solid fa-comments text-5xl mb-3 opacity-30"></i>
            <p class="text-sm">💬 开始你的第一段对话吧</p>
            <p class="text-[11px] mt-1">选择模型后，在下方输入框发送消息</p>
        </div>
    </div>

    <footer class="border-t border-black/5 p-3 shrink-0 bg-white/40 dark:bg-white/5">
        <div class="flex items-end gap-2">
            <button onclick="document.getElementById('imgUpload').click()" class="w-10 h-10 rounded-lg border border-black/10 flex items-center justify-center text-gray-500 hover:text-accent transition shrink-0" title="上传图片">
                <i class="fa-solid fa-image"></i>
            </button>
            <input type="file" id="imgUpload" accept="image/*" class="hidden" onchange="handleImgUpload(event)">
            <div class="flex-1 relative">
                <textarea id="msgInput" rows="1" placeholder="输入消息... (Enter 发送 / Shift+Enter 换行)" class="w-full px-3 py-2.5 rounded-lg border border-black/10 focus:outline-none focus:border-accent bg-white/80 dark:bg-white/10 text-sm resize-none max-h-32"></textarea>
                <span id="imgBadge" class="hidden absolute left-2 bottom-1 text-[10px] chip"><i class="fa-solid fa-paperclip"></i> 图片已附加 <i class="fa-solid fa-xmark cursor-pointer" onclick="clearImg()"></i></span>
            </div>
            <select id="modelSelect" class="px-3 py-2.5 rounded-lg border border-black/10 text-xs bg-white/80 dark:bg-white/10 shrink-0 max-w-[130px]"></select>
            <button onclick="sendMessage()" class="w-10 h-10 rounded-lg bg-accent text-white flex items-center justify-center hover:opacity-90 transition shrink-0" title="发送">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <p id="tokenInfo" class="text-[10px] text-gray-400 mt-1 px-1">🔑 Token 消耗: 0 · 消息: 0</p>
    </footer>
</main>

<!-- ========== 创建/编辑世界 模态框 ========== -->
<div id="worldModal" class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-black/5 shrink-0">
            <h2 class="font-bold text-lg"><i class="fa-solid fa-wand-magic-sparkles text-accent mr-2"></i><span id="modalTitle">创作新世界</span></h2>
            <button onclick="closeWorldModal()" class="w-8 h-8 rounded-lg hover:bg-black/5 flex items-center justify-center text-gray-500">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="flex gap-1 p-3 border-b border-black/5 overflow-x-auto shrink-0 text-xs">
            <button class="tab-btn px-3 py-1.5 rounded-lg bg-accent text-white whitespace-nowrap" data-tab="basic">🌍 基础设定</button>
            <button class="tab-btn px-3 py-1.5 rounded-lg hover:bg-black/5 whitespace-nowrap" data-tab="plane">🔮 位面系统</button>
            <button class="tab-btn px-3 py-1.5 rounded-lg hover:bg-black/5 whitespace-nowrap" data-tab="story">📖 故事线</button>
            <button class="tab-btn px-3 py-1.5 rounded-lg hover:bg-black/5 whitespace-nowrap" data-tab="characters">👥 角色卡</button>
            <button class="tab-btn px-3 py-1.5 rounded-lg hover:bg-black/5 whitespace-nowrap" data-tab="api">🔌 API配置</button>
            <button class="tab-btn px-3 py-1.5 rounded-lg hover:bg-black/5 whitespace-nowrap" data-tab="visual">🎨 视觉</button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-4">
            <div class="tab-panel" id="tab-basic">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">🌍 世界名称 *</label>
                        <input id="w-name" type="text" placeholder="如：ABO世界 / 现代都市" class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">🏷️ 标签</label>
                        <input id="w-tags" type="text" placeholder="如：现代,ABO,甜宠" class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 block mb-1">📝 世界观设定 * <span class="text-gray-400">(必写)</span></label>
                    <textarea id="w-worldview" rows="5" placeholder="详细描述这个世界的背景规则、社会结构、特殊设定等..." class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent"></textarea>
                </div>
            </div>

            <div class="tab-panel hidden" id="tab-plane">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-medium text-gray-500">🔮 位面系统 <span class="text-gray-400">(可选)</span></label>
                    <label class="flex items-center gap-1 text-xs"><input type="checkbox" id="plane-enabled" checked class="rounded"> 启用位面系统</label>
                </div>
                <textarea id="w-plane" rows="4" placeholder="位面系统描述：如何给宿主下发任务、传达信息、奖惩机制等..." class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent"></textarea>
            </div>

            <div class="tab-panel hidden" id="tab-story">
                <label class="text-xs font-medium text-gray-500 block mb-1">📖 故事线 * <span class="text-gray-400">(必写)</span></label>
                <textarea id="w-story" rows="5" placeholder="整个故事的重要走向、关键事件、起承转合..." class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent"></textarea>
            </div>

            <div class="tab-panel hidden" id="tab-characters">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border border-black/10 rounded-xl p-3 card-hover">
                        <div class="flex items-center gap-2 mb-2"><span class="text-lg">🧑‍🚀</span><h4 class="font-bold text-sm">宿主/玩家 <span class="text-red-500">*</span></h4></div>
                        <input id="c-host-name" type="text" placeholder="姓名" class="w-full px-2 py-1.5 mb-2 rounded border border-black/10 text-xs">
                        <textarea id="c-host-desc" rows="3" placeholder="性格、背景、能力等设定..." class="w-full px-2 py-1.5 rounded border border-black/10 text-xs"></textarea>
                    </div>
                    <div class="border border-black/10 rounded-xl p-3 card-hover">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2"><span class="text-lg">💖</span><h4 class="font-bold text-sm">目标对象</h4></div>
                            <label class="flex items-center gap-1 text-[10px]"><input type="checkbox" id="c-target-enabled" checked class="rounded"> 启用</label>
                        </div>
                        <input id="c-target-name" type="text" placeholder="姓名" class="w-full px-2 py-1.5 mb-2 rounded border border-black/10 text-xs">
                        <textarea id="c-target-desc" rows="3" placeholder="重要角色设定..." class="w-full px-2 py-1.5 rounded border border-black/10 text-xs"></textarea>
                    </div>
                    <div class="border border-black/10 rounded-xl p-3 card-hover">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2"><span class="text-lg">🎭</span><h4 class="font-bold text-sm">配角</h4></div>
                            <label class="flex items-center gap-1 text-[10px]"><input type="checkbox" id="c-support-enabled" class="rounded"> 启用</label>
                        </div>
                        <textarea id="c-support-desc" rows="3" placeholder="其他重要配角设定（可多个）..." class="w-full px-2 py-1.5 rounded border border-black/10 text-xs"></textarea>
                    </div>
                    <div class="border border-black/10 rounded-xl p-3 card-hover">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2"><span class="text-lg">🤖</span><h4 class="font-bold text-sm">NPC</h4></div>
                            <label class="flex items-center gap-1 text-[10px]"><input type="checkbox" id="c-npc-enabled" class="rounded"> 启用</label>
                        </div>
                        <textarea id="c-npc-desc" rows="3" placeholder="路人、商人、系统NPC等..." class="w-full px-2 py-1.5 rounded border border-black/10 text-xs"></textarea>
                    </div>
                </div>
            </div>

            <div class="tab-panel hidden" id="tab-api">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">🔌 API 提供商</label>
                        <select id="api-provider" onchange="updateModels('api-provider','api-model')" class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent">
                            <option value="">— 选择厂商 —</option>
                            <option value="openai">OpenAI</option>
                            <option value="azure">Azure OpenAI</option>
                            <option value="anthropic">Anthropic (Claude)</option>
                            <option value="google">Google (Gemini)</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="zhipu">智谱AI (GLM)</option>
                            <option value="qwen">通义千问 (DashScope)</option>
                            <option value="moonshot">Moonshot (Kimi)</option>
                            <option value="doubao">豆包 (火山引擎)</option>
                            <option value="ollama">Ollama (本地)</option>
                            <option value="custom">自定义兼容API</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">🤖 模型</label>
                        <select id="api-model" class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent"></select>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 block mb-1">🔑 API Key</label>
                    <input id="api-key" type="password" placeholder="sk-...（本地Ollama可留空）" class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent">
                    <p class="text-[10px] text-gray-400 mt-1">⚠️ Key 仅保存在本地浏览器，不会上传服务器</p>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 block mb-1">🌐 API Base URL <span class="text-gray-400">(自定义/代理时填写)</span></label>
                    <input id="api-base" type="text" placeholder="https://api.openai.com/v1" class="w-full px-3 py-2 rounded-lg border border-black/10 text-sm focus:outline-none focus:border-accent">
                    <p class="text-[10px] text-gray-400 mt-1">💡 若遇 CORS 跨域报错，可填自建中转/代理地址，如 https://your-proxy.workers.dev/v1</p>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="api-stream" checked class="rounded">
                    <label class="text-xs text-gray-500">🌊 启用流式输出（打字机效果，体验更佳）</label>
                </div>
            </div>

            <div class="tab-panel hidden" id="tab-visual">
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">🧑‍🚀 宿主头像</label>
                        <div class="flex flex-col items-center gap-2">
                            <img id="hostAvatarPreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=host" class="w-20 h-20 rounded-full border-2 border-dashed border-gray-300 object-cover">
                            <input type="file" id="hostAvatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event,'hostAvatarPreview')">
                            <button onclick="document.getElementById('hostAvatarInput').click()" class="text-[10px] px-2 py-1 rounded bg-accent-soft text-accent">上传</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">💖 对方头像</label>
                        <div class="flex flex-col items-center gap-2">
                            <img id="otherAvatarPreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=other" class="w-20 h-20 rounded-full border-2 border-dashed border-gray-300 object-cover">
                            <input type="file" id="otherAvatarInput" accept="image/*" class="hidden" onchange="previewAvatar(event,'otherAvatarPreview')">
                            <button onclick="document.getElementById('otherAvatarInput').click()" class="text-[10px] px-2 py-1 rounded bg-accent-soft text-accent">上传</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-500 block mb-1">🖼️ 聊天背景</label>
                        <div class="flex flex-col items-center gap-2">
                            <div id="bgPreview" class="w-20 h-20 rounded-lg border-2 border-dashed border-gray-300 bg-gray-100 flex items-center justify-center text-gray-400">
                                <i class="fa-solid fa-image"></i>
                            </div>
                            <input type="file" id="bgInput" accept="image/*" class="hidden" onchange="previewBg(event)">
                            <button onclick="document.getElementById('bgInput').click()" class="text-[10px] px-2 py-1 rounded bg-accent-soft text-accent">上传</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-2 p-4 border-t border-black/5 shrink-0">
            <button onclick="closeWorldModal()" class="px-4 py-2 rounded-lg border border-black/10 text-sm hover:bg-black/5">取消</button>
            <button onclick="saveWorld()" class="px-4 py-2 rounded-lg bg-accent text-white text-sm hover:opacity-90">💾 保存世界</button>
        </div>
    </div>
</div>

<!-- ========== 设置模态框 ========== -->
<div id="settingsModal" class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#2a2a2a] rounded-2xl shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-black/5 shrink-0">
            <h2 class="font-bold text-lg"><i class="fa-solid fa-gear text-accent mr-2"></i>⚙️ 设置</h2>
            <button onclick="closeSettings()" class="w-8 h-8 rounded-lg hover:bg-black/5 flex items-center justify-center text-gray-500">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-5">
            <div>
                <label class="text-xs font-medium text-gray-500 block mb-2">🎨 主题切换</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTheme('sky')" class="theme-opt flex items-center gap-2 p-2 rounded-lg border border-black/10 hover:border-accent text-xs" data-theme="sky">

let state = {
    worlds: [],
    currentWorldId: null,
    theme: 'sky',
    globalAPI: { provider: '', model: '', key: '', base: '' },
    editingId: null
};

// ================= 持久化 =================
function saveState() {
    try { localStorage.setItem('rpg_state', JSON.stringify(state)); } catch(e) {}
}
function loadState() {
    const s = localStorage.getItem('rpg_state');
    if (s) {
        try { state = JSON.parse(s); } catch(e){ state.worlds = DEFAULT_WORLDS; }
    } else {
        state.worlds = JSON.parse(JSON.stringify(DEFAULT_WORLDS));
    }
    if (!state.theme) state.theme = 'sky';
    if (!state.globalAPI) state.globalAPI = { provider:'', model:'', key:'', base:'' };
    applyTheme(state.theme);
    renderWorldList();
    populateModelSelect();
}

// ================= 主题 =================
function applyTheme(theme) {
    document.documentElement.className = '';
    document.documentElement.classList.add(`theme-${theme}`);
    if (theme === 'dark') document.documentElement.classList.add('dark');
    document.body.className = `bg-app text-gray-800 transition-colors duration-300 h-screen flex ${theme==='dark'?'text-white':''}`;
    state.theme = theme;
    document.querySelectorAll('.theme-opt').forEach(b=>{
        b.classList.toggle('border-accent', b.dataset.theme===theme);
        b.classList.toggle('ring-2', b.dataset.theme===theme);
    });
}
function setTheme(t) { applyTheme(t); saveState(); toast('🎨 主题已切换'); }

// ================= 世界列表 =================
function renderWorldList() {
    const el = document.getElementById('worldList');
    el.innerHTML = state.worlds.map(w => `
        <div onclick="switchWorld('${w.id}')" class="group relative bg-white/70 dark:bg-white/5 rounded-xl p-3 cursor-pointer card-hover border-l-4 ${w.id===state.currentWorldId?'border-accent':'border-transparent'}">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-lg">${w.icon || '🌍'}</span>
                <span class="font-bold text-sm truncate flex-1">${escapeHtml(w.name)}</span>
                ${w.chats && w.chats.length ? `<span class="text-[10px] bg-accent-soft text-accent px-1.5 py-0.5 rounded-full">${w.chats.length}</span>` : ''}
            </div>
            <p class="text-[11px] text-gray-500 truncate">${(w.worldview||'').substring(0,30)}...</p>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 flex flex-col gap-1 transition">
                <button onclick="event.stopPropagation();editWorld('${w.id}')" class="w-6 h-6 rounded-full bg-white shadow flex items-center justify-center text-xs text-gray-500 hover:text-accent"><i class="fa-solid fa-pen"></i></button>
                <button onclick="event.stopPropagation();deleteWorld('${w.id}')" class="w-6 h-6 rounded-full bg-white shadow flex items-center justify-center text-xs text-gray-500 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function switchWorld(id) {
    state.currentWorldId = id;
    saveState();
    renderWorldList();
    renderChat();
    populateModelSelect();
}

// ================= 聊天渲染 =================
function currentWorld() { return state.worlds.find(w=>w.id===state.currentWorldId); }

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderChat() {
    const w = currentWorld();
    const area = document.getElementById('chatArea');
    const empty = document.getElementById('emptyState');
    const titleEl = document.getElementById('chatTitle');
    const subEl = document.getElementById('chatSubtitle');
    const avatarEl = document.getElementById('chatAvatar');

    if (!w) {
        titleEl.textContent = '选择一个世界开始冒险 🚀';
        subEl.textContent = '从左侧选择或创作一个新世界';
        avatarEl.innerHTML = '<i class="fa-solid fa-earth-americas"></i>';
        area.innerHTML = '';
        area.appendChild(empty);
        empty.style.display = 'flex';
        updateTokenInfo();
        return;
    }

    titleEl.textContent = w.name;
    subEl.textContent = (w.tags||[]).join(' · ') || '沉浸式角色扮演';
    avatarEl.innerHTML = `<img src="${w.otherAvatar||''}" class="w-full h-full rounded-full object-cover" onerror="this.outerHTML='<i class=\\"fa-solid fa-user-astronaut\\"></i>'">`;

    if (!w.chats || !w.chats.length) {
        area.innerHTML = '';
        area.appendChild(empty);
        empty.style.display = 'flex';
        updateTokenInfo();
        return;
    }

    area.innerHTML = w.chats.map((m,i)=> renderMessage(m,i)).join('');
    area.scrollTop = area.scrollHeight;
    updateTokenInfo();
}

function renderMessage(m, idx) {
    const w = currentWorld();
    const isUser = m.role === 'user';
    const avatar = isUser ? (w.hostAvatar||'') : (w.otherAvatar||'');
    return `
    <div class="flex items-start gap-2 fade-in ${isUser?'flex-row-reverse':'flex-row'} group" data-idx="${idx}">
        <div class="w-9 h-9 rounded-full bg-accent-soft flex items-center justify-center text-accent text-sm shrink-0 overflow-hidden">
            ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover" onerror="this.style.display='none'">` : ''}
            <i class="fa-solid ${isUser?'fa-user':'fa-user-astronaut'}"></i>
        </div>
        <div class="flex flex-col ${isUser?'items-end':'items-start'} max-w-[75%]">
            <div class="chat-bubble ${isUser?'user bg-[#95ec69] text-gray-900':'other bg-white dark:bg-[#2b2b2b] text-gray-800 dark:text-gray-100'} rounded-2xl px-4 py-2 text-sm shadow-sm">
                ${m.image ? `<img src="${m.image}" class="max-w-[200px] rounded-lg mb-1"><br>` : ''}
                <div class="md-body">${m.content ? marked.parseInline(m.content) : ''}</div>
            </div>
            <div class="flex items-center gap-2 mt-1 opacity-0 group-hover:opacity-100 transition text-[10px] text-gray-400 px-1">
                ${m.tokens ? `<span>🪙 ${m.tokens} tok</span>` : ''}
                <button onclick="deleteMsg(${idx})" class="hover:text-red-500"><i class="fa-solid fa-trash"></i> 删除</button>
                ${!isUser ? `<button onclick="regenerateMsg(${idx})" class="hover:text-accent"><i class="fa-solid fa-rotate"></i> 重新生成</button>` : ''}
                <button onclick="editMsg(${idx})" class="hover:text-accent"><i class="fa-solid fa-pen"></i> 修改</button>
            </div>
        </div>
    </div>`;
}

function updateTokenInfo() {
    const w = currentWorld();
    const info = document.getElementById('tokenInfo');
    if (!w || !w.chats) { info.textContent = '🔑 Token 消耗: 0 · 消息: 0'; return; }
    const total = w.chats.reduce((s,m)=>s+(m.tokens||0),0);
    info.textContent = `🔑 Token 消耗: ${total} · 消息: ${w.chats.length}`;
}

// ================= 系统提示词 =================
function buildSystemPrompt(w) {
    let p = `【世界观设定】\n${w.worldview||''}\n\n`;
    if (w.planeEnabled && w.plane) p += `【位面系统】\n${w.plane}\n\n`;
    p += `【故事线】\n${w.story||''}\n\n`;
    p += `【角色设定】\n`;
    if (w.host) p += `- 宿主/玩家：${w.host.name} — ${w.host.desc}\n`;
    if (w.targetEnabled && w.target) p += `- 目标对象：${w.target.name} — ${w.target.desc}\n`;
    if (w.supportEnabled && w.support) p += `- 配角：${w.support}\n`;
    if (w.npcEnabled && w.npc) p += `- NPC：${w.npc}\n`;
    p += `\n请严格根据以上设定进行角色扮演。你扮演除宿主之外的所有角色，用生动细腻的中文回复，包含动作、神态、心理和环境描写。注意区分不同角色的语言风格。可使用 **加粗**、*斜体*、> 引用等 Markdown 格式。只输出角色扮演内容，不要跳出角色。`;
    return p;
}

// 将聊天记录转为 API 所需的多模态 messages（OpenAI 格式）
function buildMessages(w, extraUser) {
    const msgs = [{ role: 'system', content: buildSystemPrompt(w) }];
    const history = w.chats.slice(-20);
    history.forEach(m=>{
        if (!m.content && !m.image) return;
        if (m.role === 'assistant' || m.role === 'user') {
            msgs.push({ role: m.role, content: m.content || '' });
        }
    });
    if (extraUser) msgs.push(extraUser);
    return msgs;
}

// ================= 发送消息 =================
async function sendMessage() {
    const w = currentWorld();
    if (!w) { toast('⚠️ 请先选择或创建一个世界'); return; }

    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    const img = input.dataset.img || '';
    if (!content && !img) return;

    const api = (w.api && w.api.key) ? w.api : state.globalAPI;
    if (!api || !api.provider) { toast('🔑 请先在设置或世界卡片中配置 API 厂商'); return; }
    // ollama 本地可无 key；云端必须有 key
    if (!api.key && api.provider !== 'ollama') { toast('🔑 请先填写 API Key'); return; }

    const userMsg = { role: 'user', content, image: img, tokens: estimateTokens(content) };
    if (!w.chats) w.chats = [];
    w.chats.push(userMsg);

    // 清空输入（先备份图片，regenerate 时需要）
    input.value = '';
    delete input.dataset.img;
    document.getElementById('imgBadge').classList.add('hidden');
    autoResize(input);
    renderChat();
    saveState();

    const area = document.getElementById('chatArea');
    const typingId = 'typing-' + Date.now();
    area.insertAdjacentHTML('beforeend', `
        <div id="${typingId}" class="flex items-start gap-2 fade-in">
            <div class="w-9 h-9 rounded-full bg-accent-soft flex items-center justify-center text-accent text-sm shrink-0">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <div class="chat-bubble other bg-white dark:bg-[#2b2b2b] rounded-2xl px-4 py-2 shadow-sm">
                <span class="typing-dot">●</span><span class="typing-dot">●</span><span class="typing-dot">●</span>
            </div>
        </div>`);
    area.scrollTop = area.scrollHeight;

    try {
        // extraUser 用于 API：若带图则用多模态格式
        const extraUser = content || img ? { role: 'user', content: img ? [{type:'text',text:content||''},{type:'image_url',image_url:{url:img}}] : content } : null;

        const stream = w.api?.stream !== false && state.globalAPI?.stream !== false;
        let reply = '';
        if (stream) {
            reply = await streamAPI(api, buildMessages(w, extraUser), typingId);
        } else {
            reply = await callAPI(api, buildMessages(w, extraUser));
        }

        document.getElementById(typingId)?.remove();
        const aiMsg = { role: 'assistant', content: reply, tokens: estimateTokens(reply) };
        w.chats.push(aiMsg);
        renderChat();
        saveState();
    } catch(e) {
        document.getElementById(typingId)?.remove();
        const errMsg = { role: 'assistant', content: `⚠️ **请求失败**：${escapeHtml(e.message)}\n\n💡 常见排查：\n- CORS 跨域被拦截 → 在 API 配置里填**中转/代理地址**\n- Key 错误或额度不足\n- 模型名称不正确`, tokens: 0 };
        w.chats.push(errMsg);
        renderChat();
        saveState();
    }
}

function estimateTokens(s) { return Math.ceil((s||'').length / 4); }

// ================= API 调用（非流式） =================
async function callAPI(api, messages) {
    const model = api.model;
    let baseUrl = api.base || DEFAULT_BASE[api.provider] || 'https://api.openai.com/v1';

    // Anthropic 原生格式
    if (api.provider === 'anthropic') {
        const sysMsg = messages.find(m=>m.role==='system');
        const chatMsgs = messages.filter(m=>m.role!=='system').map(m=>{
            // 统一多模态：将 OpenAI 的 content 数组转 Claude 的 content 数组
            if (Array.isArray(m.content)) {
                return { role: m.role, content: m.content.map(p=>{
                    if (p.type==='image_url') return { type:'image', source:{ type:'base64', media_type: guessMime(p.image_url.url), data: p.image_url.url.split(',')[1] } };
                    return { type:'text', text: p.text||'' };
                }) };
            }
            return m;
        });
        const resp = await fetch(`${baseUrl}/messages`, {
            method: 'POST',
            headers: { 'x-api-key': api.key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' },
            body: JSON.stringify({ model, system: sysMsg?.content || '', messages: chatMsgs, max_tokens: 2048 })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || 'API Error');
        return data.content?.map(b=>b.text||'').join('') || '';
    }

    // Google Gemini 原生格式
    if (api.provider === 'google') {
        const sysMsg = messages.find(m=>m.role==='system');
        const parts = [];
        if (sysMsg) parts.push({ text: `【系统设定】\n${sysMsg.content}` });
        messages.filter(m=>m.role!=='system').forEach(m=>{
            const role = m.role==='assistant' ? 'model' : 'user';
            parts.push({ role, parts: toGeminiParts(m.content) });
        });
        const url = `${baseUrl}/models/${model}:generateContent?key=${encodeURIComponent(api.key)}`;
        const resp = await fetch(url, {
            method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({ contents: groupGeminiParts(parts), generationConfig:{ temperature:0.8, maxOutputTokens:2048 } })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || 'API Error');
        return data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    }

    // Azure OpenAI：base 形如 https://xxx.openai.azure.com/openai/deployments/{deploy}
    if (api.provider === 'azure') {
        const resp = await fetch(`${baseUrl}/chat/completions?api-version=2024-08-01-preview`, {
            method:'POST', headers:{ 'api-key': api.key, 'Content-Type':'application/json' },
            body: JSON.stringify({ messages, temperature:0.8, max_tokens:2048 })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || 'API Error');
        return data.choices?.[0]?.message?.content || '';
    }

    // OpenAI 兼容格式（DeepSeek / GLM / Qwen / Moonshot / 自定义 / Ollama / 中转）
    const resp = await fetch(`${baseUrl}/chat/completions`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${api.key}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, messages, temperature: 0.8, max_tokens: 2048 })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error?.message || JSON.stringify(data.error) || 'API Error');
    return data.choices?.[0]?.message?.content || '';
}

// ================= 流式输出（SSE） =================
async function streamAPI(api, messages, typingId) {
    const model = api.model;
    let baseUrl = api.base || DEFAULT_BASE[api.provider] || 'https://api.openai.com/v1';
    const typingEl = document.getElementById(typingId);
    const bubble = typingEl?.querySelector('.chat-bubble');
    let acc = '';

    const finish = ()=>{
        if (typingEl && bubble) {
            bubble.classList.remove('stream-cursor');
            bubble.innerHTML = `<div class="md-body">${marked.parseInline(acc)}</div>`;
        }
        return acc;
    };

    // Anthropic 流式
    if (api.provider === 'anthropic') {
        const sysMsg = messages.find(m=>m.role==='system');
        const chatMsgs = messages.filter(m=>m.role!=='system');
        const resp = await fetch(`${baseUrl}/messages`, {
            method:'POST',
            headers:{ 'x-api-key':api.key, 'anthropic-version':'2023-06-01', 'content-type':'application/json', 'anthropic-dangerous-direct-browser-access':'true' },
            body: JSON.stringify({ model, system:sysMsg?.content||'', messages:chatMsgs, max_tokens:2048, stream:true })
        });
        if (!resp.ok) { const d=await resp.json(); throw new Error(d.error?.message||'stream error'); }
        await forEachSSE(resp, line=>{
            if (line.event==='content_block_delta' && line.data?.delta?.text) { acc += line.data.delta.text; renderStream(bubble, acc); }
        });
        return finish();
    }

    // Google Gemini 流式
    if (api.provider === 'google') {
        const sysMsg = messages.find(m=>m.role==='system');
        const parts = [];
        if (sysMsg) parts.push({ text: `【系统设定】\n${sysMsg.content}` });
        messages.filter(m=>m.role!=='system').forEach(m=>{ parts.push({ role: m.role==='assistant'?'model':'user', parts: toGeminiParts(m.content) }); });
        const url = `${baseUrl}/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(api.key)}`;
        const resp = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ contents: groupGeminiParts(parts), generationConfig:{ temperature:0.8 } }) });
        if (!resp.ok) { const d=await resp.json(); throw new Error(d.error?.message||'stream error'); }
        await forEachSSE(resp, line=>{ const txt = line.data?.candidates?.[0]?.content?.parts?.[0]?.text; if (txt) { acc += txt; renderStream(bubble, acc); } });
        return finish();
    }

    // OpenAI 兼容流式（含 Azure / Ollama / 中转）
    const url = api.provider==='azure'
        ? `${baseUrl}/chat/completions?api-version=2024-08-01-preview&api-key=${encodeURIComponent(api.key)}`
        : `${baseUrl}/chat/completions`;
    const headers = api.provider==='azure'
        ? { 'Content-Type':'application/json', 'api-key':api.key }
        : { 'Authorization': `Bearer ${api.key}`, 'Content-Type':'application/json' };
    const resp = await fetch(url, { method:'POST', headers, body: JSON.stringify({ model, messages, temperature:0.8, max_tokens:2048, stream:true }) });
    if (!resp.ok) { const d=await resp.json().catch(()=>({})); throw new Error(d.error?.message||`HTTP ${resp.status}`); }

    await forEachSSE(resp, line=>{
        const choice = line.data?.choices?.[0];
        if (choice?.delta?.content) { acc += choice.delta.content; renderStream(bubble, acc); }
    });
    return finish();
}

// 把累积文本渲染到 bubble（流式光标）
function renderStream(bubble, text) {
    if (!bubble) return;
    bubble.classList.add('stream-cursor');
    bubble.innerHTML = `<div class="md-body">${marked.parseInline(text)}</div>`;
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
}

// 通用 SSE 解析器：遍历每个 event
async function forEachSSE(resp, onLine) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const chunks = buf.split('\n\n');
        buf = chunks.pop() || '';
        for (const chunk of chunks) {
            const lines = chunk.split('\n');
            let event = 'message', dataStr = '';
            for (const ln of lines) {
                if (ln.startsWith('event:')) event = ln.slice(6).trim();
                else if (ln.startsWith('data:')) dataStr += ln.slice(5).trim();
            }
            if (dataStr === '[DONE]') return;
            if (!dataStr) continue;
            try { onLine({ event, data: JSON.parse(dataStr) }); } catch(e) {}
        }
    }
}

// ================= 多模态辅助 =================
function guessMime(dataUrl){ const m = (dataUrl||'').match(/^data:(image\/[^;]+);/); return m ? m[1] : 'image/png'; }
function toGeminiParts(content){
    if (Array.isArray(content)) {
        return content.map(p=>{
            if (p.type==='image_url') { const [meta, b64] = (p.image_url.url||'').split(','); const mime = guessMime(p.image_url.url); return { inline_data:{ mime_type: mime, data: b64 } }; }
            return { text: p.text||'' };
        });
    }
    return [{ text: content || '' }];
}
function groupGeminiParts(parts){
    // Gemini 要求 contents 是 [{role, parts}]，user/model 交替
    const out = []; let cur = null;
    for (const p of parts) {
        if (!cur || cur.role !== p.role) { cur = { role: p.role, parts: [] }; out.push(cur); }
        cur.parts.push(...p.parts);
    }
    return out;
}

// ================= 消息操作 =================
function deleteMsg(idx) {
    const w = currentWorld();
    w.chats.splice(idx, 1);
    saveState();
    renderChat();
}
function regenerateMsg(idx) {
    const w = currentWorld();
    if (idx !== undefined) w.chats.splice(idx); // 删除该条及之后
    saveState();
    sendMessage();
}
function editMsg(idx) {
    const w = currentWorld();
    const m = w.chats[idx];
    const newContent = prompt('修改消息内容：', m.content);
    if (newContent !== null && newContent.trim()) {
        m.content = newContent.trim();
        saveState();
        renderChat();
    }
}
function clearChat() {
    const w = currentWorld();
    if (!w) return;
    if (!confirm('确定清空当前世界的所有对话？')) return;
    w.chats = [];
    saveState();
    renderChat();
}

// ================= 世界模态框 =================
function openWorldModal(id) {
    document.getElementById('worldModal').classList.remove('hidden');
    if (id) {
        const w = state.worlds.find(x=>x.id===id);
        state.editingId = id;
        document.getElementById('modalTitle').textContent = '编辑世界';
        fillWorldForm(w);
    } else {
        state.editingId = null;
        document.getElementById('modalTitle').textContent = '创作新世界 ✨';
        resetWorldForm();
    }
    switchTab('basic');
}
function closeWorldModal() { document.getElementById('worldModal').classList.add('hidden'); }

function fillWorldForm(w) {
    document.getElementById('w-name').value = w.name||'';
    document.getElementById('w-tags').value = (w.tags||'').join(',');
    document.getElementById('w-worldview').value = w.worldview||'';
    document.getElementById('plane-enabled').checked = w.planeEnabled!==false;
    document.getElementById('w-plane').value = w.plane||'';
    document.getElementById('w-story').value = w.story||'';
    document.getElementById('c-host-name').value = w.host?.name||'';
    document.getElementById('c-host-desc').value = w.host?.desc||'';
    document.getElementById('c-target-enabled').checked = w.targetEnabled!==false;
    document.getElementById('c-target-name').value = w.target?.name||'';
    document.getElementById('c-target-desc').value = w.target?.desc||'';
    document.getElementById('c-support-enabled').checked = !!w.supportEnabled;
    document.getElementById('c-support-desc').value = w.support||'';
    document.getElementById('c-npc-enabled').checked = !!w.npcEnabled;
    document.getElementById('c-npc-desc').value = w.npc||'';
    document.getElementById('api-provider').value = w.api?.provider||'';
    document.getElementById('api-key').value = w.api?.key||'';
    document.getElementById('api-base').value = w.api?.base||'';
    document.getElementById('api-stream').checked = w.api?.stream !== false;
    updateModels('api-provider','api-model');
    document.getElementById('api-model').value = w.api?.model||'';
    document.getElementById('hostAvatarPreview').src = w.hostAvatar||'https://api.dicebear.com/7.x/avataaars/svg?seed=host';
    document.getElementById('otherAvatarPreview').src = w.otherAvatar||'https://api.dicebear.com/7.x/avataaars/svg?seed=other';
    if (w.bg) { document.getElementById('bgPreview').style.backgroundImage = `url(${w.bg})`; document.getElementById('bgPreview').style.backgroundSize='cover'; }
}
function resetWorldForm() {
    ['w-name','w-tags','w-worldview','w-plane','w-story','c-host-name','c-host-desc','c-target-name','c-target-desc','c-support-desc','c-npc-desc','api-key','api-base'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('plane-enabled').checked = true;
    document.getElementById('c-target-enabled').checked = true;
    document.getElementById('c-support-enabled').checked = false;
    document.getElementById('c-npc-enabled').checked = false;
    document.getElementById('api-stream').checked = true;
    document.getElementById('api-provider').value='';
    document.getElementById('hostAvatarPreview').src='https://api.dicebear.com/7.x/avataaars/svg?seed=host';
    document.getElementById('otherAvatarPreview').src='https://api.dicebear.com/7.x/avataaars/svg?seed=other';
    document.getElementById('bgPreview').style.backgroundImage='';
    updateModels('api-provider','api-model');
}

function saveWorld() {
    const name = document.getElementById('w-name').value.trim();
    const worldview = document.getElementById('w-worldview').value.trim();
    if (!name) { toast('⚠️ 请填写世界名称'); return; }
    if (!worldview) { toast('⚠️ 世界观设定为必填项'); return; }

    const data = {
        name, icon: autoIcon(name),
        tags: document.getElementById('w-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
        worldview,
        planeEnabled: document.getElementById('plane-enabled').checked,
        plane: document.getElementById('w-plane').value.trim(),
        story: document.getElementById('w-story').value.trim(),
        host: { name: document.getElementById('c-host-name').value.trim() || '宿主', desc: document.getElementById('c-host-desc').value.trim() },
        targetEnabled: document.getElementById('c-target-enabled').checked,
        target: { name: document.getElementById('c-target-name').value.trim(), desc: document.getElementById('c-target-desc').value.trim() },
        supportEnabled: document.getElementById('c-support-enabled').checked,
        support: document.getElementById('c-support-desc').value.trim(),
        npcEnabled: document.getElementById('c-npc-enabled').checked,
        npc: document.getElementById('c-npc-desc').value.trim(),
        api: {
            provider: document.getElementById('api-provider').value,
            model: document.getElementById('api-model').value,
            key: document.getElementById('api-key').value,
            base: document.getElementById('api-base').value,
            stream: document.getElementById('api-stream').checked
        },
        hostAvatar: document.getElementById('hostAvatarPreview').src,
        otherAvatar: document.getElementById('otherAvatarPreview').src,
        bg: document.getElementById('bgPreview').style.backgroundImage.replace(/url\("?(.+?)"?\)/, '$1') || ''
    };

    if (state.editingId) {
        const w = state.worlds.find(x=>x.id===state.editingId);
        Object.assign(w, data);
        toast('✅ 世界已更新');
    } else {
        const newWorld = { id: 'w-' + Date.now(), chats: [], ...data };
        state.worlds.unshift(newWorld);
        state.currentWorldId = newWorld.id;
        toast('🎉 新世界已创建');
    }
    saveState();
    renderWorldList();
    renderChat();
    closeWorldModal();
}

function autoIcon(name){
    if (/修|仙|剑|古风|江湖/.test(name)) return '⚔️';
    if (/都市|现代|校园|职场|abo/i.test(name)) return '🌆';
    if (/西幻|魔幻|龙|骑士|中世纪/.test(name)) return '🐉';
    if (/星|太空|赛博|未来|科幻/.test(name)) return '🚀';
    return '🌍';
}

function editWorld(id) { openWorldModal(id); }
function deleteWorld(id) {
    if (!confirm('确定删除这个世界？此操作不可撤销。')) return;
    state.worlds = state.worlds.filter(w=>w.id!==id);
    if (state.currentWorldId === id) state.currentWorldId = state.worlds[0]?.id || null;
    saveState();
    renderWorldList();
    renderChat();
}

// ================= Tab 切换 =================
function switchTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
    document.getElementById('tab-'+tab).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(b=>{
        b.classList.toggle('bg-accent', b.dataset.tab===tab);
        b.classList.toggle('text-white', b.dataset.tab===tab);
    });
}
document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

// ================= 模型下拉 =================
function updateModels(providerId, modelId) {
    const prov = document.getElementById(providerId).value;
    const sel = document.getElementById(modelId);
    const cur = sel.value;
    sel.innerHTML = '<option value="">— 选择/输入模型 —</option>';
    (MODEL_MAP[prov]||[]).forEach(m=>{
        const o = document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o);
    });
    // 自定义/Ollama 允许自由输入
    if (prov==='custom' || prov==='ollama' || prov==='azure') {
        sel.innerHTML += '<option value="__custom">✍️ 手动输入...</option>';
        sel.addEventListener('change', function once(){ if(this.value==='__custom'){ const v=prompt('请输入自定义模型名：'); if(v) this.value=v; } this.removeEventListener('change',once); });
    }
    if (cur && (MODEL_MAP[prov]||[]).includes(cur)) sel.value = cur;
}
function updateGlobalModels() { updateModels('global-provider','global-model'); }
function populateModelSelect() {
    const w = currentWorld();
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = '<option value="">选择模型</option>';
    const api = (w && w.api?.provider) ? w.api : state.globalAPI;
    if (api?.provider) {
        (MODEL_MAP[api.provider]||[]).forEach(m=>{
            const o = document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o);
        });
    }
}
function saveGlobalAPI() {
    state.globalAPI = {
        provider: document.getElementById('global-provider').value,
        model: document.getElementById('global-model').value,
        key: document.getElementById('global-key').value,
        base: document.getElementById('global-base').value
    };
    saveState();
    populateModelSelect();
    closeSettings();
    toast('✅ 全局 API 已保存');
}

// ================= 设置 =================
function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

// ================= 数据导入导出 =================
function exportData() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rpg-worlds-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('📤 数据已导出');
}
function importData() { document.getElementById('importFile').click(); }
function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
        try {
            const data = JSON.parse(reader.result);
            if (data.worlds) {
                state = { ...state, ...data, globalAPI: data.globalAPI || state.globalAPI };
                applyTheme(state.theme || 'sky');
                saveState();
                renderWorldList();
                renderChat();
                toast('📥 数据已导入');
            }
        } catch(err) { toast('❌ 文件格式错误'); }
    };
    reader.readAsText(file);
}
function clearAllData() {
    if (!confirm('确定清空所有数据？此操作不可撤销！')) return;
    localStorage.removeItem('rpg_state');
    location.reload();
}

// ================= 图片上传 =================
function handleImgUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5*1024*1024) { toast('⚠️ 图片建议小于 5MB'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
        const input = document.getElementById('msgInput');
        input.dataset.img = reader.result;
        document.getElementById('imgBadge').classList.remove('hidden');
        toast('🖼️ 图片已附加，发送即可');
    };
    reader.readAsDataURL(file);
}
function clearImg(){ delete document.getElementById('msgInput').dataset.img; document.getElementById('imgBadge').classList.add('hidden'); }
function previewAvatar(e, id) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ document.getElementById(id).src = reader.result; };
    reader.readAsDataURL(file);
}
function previewBg(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
        const el = document.getElementById('bgPreview');
        el.style.backgroundImage = `url(${reader.result})`;
        el.style.backgroundSize = 'cover';
        document.documentElement.style.setProperty('--chat-bg', `url(${reader.result})`);
    };
    reader.readAsDataURL(file);
}

// ================= 工具函数 =================
let toastTimer;
function toast(msg) {
    const t = document.getElementById('toast');
    t.querySelector('div').textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.add('hidden'), 2500);
}
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}

// ================= 事件绑定 =================
document.getElementById('msgInput').addEventListener('input', function(){ autoResize(this); });
document.getElementById('msgInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('searchInput').addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    document.querySelectorAll('#worldList > div').forEach(el=>{
        el.style.display = !q || el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
});

// marked 安全配置：允许 GitHub 风格
if (window.marked) { marked.setOptions({ breaks:true, gfm:true }); }

// ================= 初始化 =================
loadState();
if (state.worlds.length && !state.currentWorldId) {
    state.currentWorldId = state.worlds[0].id;
    saveState();
}
renderChat();
updateModels('api-provider','api-model');
updateModels('global-provider','global-model');
